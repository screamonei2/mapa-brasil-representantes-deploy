                                })();
                                break;

                            case 'bairro':
                                // Busca por bairro - sempre buscar, independente da bairrosLayer estar carregada
                                // CORREÇÃO: Passar estado atual para restringir busca
                                const estadoAtual = currentState ? currentState.code : 'SP';
                                const bairroResults = searchInBairros(normalizedQuery, estadoAtual);
                                bairroResults.forEach(id => foundRepresentativeIds.add(id));

                                // REMOVIDO: Fallback problemático que causava conflitos entre estados
                                // for (const [location, repIds] of representativesByLocation.entries()) {
                                //     if (normalize(location).includes(normalizedQuery)) {
                                //         repIds.forEach(id => foundRepresentativeIds.add(id));
                                //     }
                                // }
                                break;

                            case 'cidade':
                                // Busca por cidade - implementar busca fuzzy inteligente
                                // CORREÇÃO: Passar estado atual para priorizar resultados
                                const estadoAtualCidade = currentState ? currentState.code : null;
                                const cidadeResults = searchInCidades(normalizedQuery, estadoAtualCidade);
                                cidadeResults.forEach(id => foundRepresentativeIds.add(id));
                                break;
                        }

                        // Busca adicional por nome/contato/email APENAS quando a intenção é representante
                        if (searchType.type === 'representante') {
                            representativesData.forEach(rep => {
                                const normalizedNome = normalize(rep.NomeRepresentante);
                                const normalizedContato = normalize(rep.Contato);
                                const normalizedEmail = normalize(rep.email);

                                // Busca mais rigorosa: exata ou que comece com a query
                                if (normalizedNome === normalizedQuery || normalizedNome.startsWith(normalizedQuery) ||
                                    normalizedContato === normalizedQuery || normalizedContato.startsWith(normalizedQuery) ||
                                    normalizedEmail === normalizedQuery || normalizedEmail.startsWith(normalizedQuery)) {
                                    foundRepresentativeIds.add(rep.id);
                                }
                            });
                        }

                        return representativesData.filter(rep => foundRepresentativeIds.has(rep.id));
                    }

                    // Função auxiliar para verificar se um representante atende uma localização
                    function checkRepresentativeLocation(representative, locationQuery) {
                        const normalizedLocation = normalize(locationQuery);

                        // Verificar nos estados atendidos
                        if (representative.EstadosDetalhados) {
                            for (const [estado, dadosEstado] of Object.entries(representative.EstadosDetalhados)) {
                                const normalizedEstado = normalize(estado);
                                if (normalizedEstado === normalizedLocation || normalizedEstado.startsWith(normalizedLocation)) {
                                    return true;
                                }

                                // Verificar nas cidades
                                if (dadosEstado.cidades) {
                                    for (const cidade of dadosEstado.cidades) {
                                        const normalizedCidade = normalize(cidade);
                                        if (normalizedCidade === normalizedLocation ||
                                            (normalizedLocation.length >= 4 && normalizedCidade.startsWith(normalizedLocation))) {
                                            return true;
                                        }
                                    }
                                }

                                // Verificar nos bairros (para SP)
                                if (dadosEstado.bairros) {
                                    for (const bairro of dadosEstado.bairros) {
                                        const normalizedBairro = normalize(bairro);
                                        if (normalizedBairro === normalizedLocation ||
                                            (normalizedLocation.length >= 4 && normalizedBairro.startsWith(normalizedLocation))) {
                                            return true;
                                        }
                                    }
                                }
                            }
                        }

                        return false;
                    }

                    // --- FUNÇÕES PARA BUSCA MELHORADA ---

                    // Gerar sugestões inteligentes
                    function generateSuggestions(query) {
                        if (!query || query.length < 2) return [];

                        const suggestions = [];
                        const normalizedQuery = normalize(query);
                        const maxSuggestions = 8;

                        // Detectar padrão "cidade UF" (ex: "cascavel pr") para filtrar cidades pelo estado informado
                        // Aplica apenas para UF de 2 letras no fim da query
                        let cidadeParte = null;
                        let ufParte = null;
                        const matchCidadeUf = normalizedQuery.match(/^(.+?)\s+([a-z]{2})$/i);
                        if (matchCidadeUf) {
                            cidadeParte = matchCidadeUf[1].trim();
                            ufParte = matchCidadeUf[2].trim().toUpperCase();
                        }

                        // 1. Estados
                        if (currentSearchFilter === 'all' || currentSearchFilter === 'estados') {
                            const estados = ['São Paulo', 'Rio de Janeiro', 'Minas Gerais', 'Bahia', 'Paraná', 'Rio Grande do Sul',
                                'Pernambuco', 'Ceará', 'Pará', 'Santa Catarina', 'Goiás', 'Maranhão', 'Paraíba',
                                'Amazonas', 'Espírito Santo', 'Mato Grosso', 'Alagoas', 'Piauí', 'Distrito Federal',
                                'Mato Grosso do Sul', 'Sergipe', 'Rio Grande do Norte', 'Rondônia', 'Acre', 'Amapá',
                                'Roraima', 'Tocantins'];

                            estados.forEach(estado => {
                                const matchResult = isExactMatch(query, estado);
                                if (matchResult.match && suggestions.length < maxSuggestions) {
                                    suggestions.push({
                                        type: 'estado',
                                        text: estado,
                                        similarity: matchResult.score / 100,
                                        priority: matchResult.type === 'exact' ? 5 : matchResult.type === 'partial' ? 3 : 1
                                    });
                                }
                            });
                        }

                        // 2. Cidades (baseado nos dados dos representantes)
                        if (currentSearchFilter === 'all' || currentSearchFilter === 'cidades') {
                            const cidadesSet = new Set();
                            const cidadesPorEstado = new Map(); // cidade -> [estados] para evitar duplicatas

                            // Primeiro, coletar todas as cidades com seus estados
                            representativesData.forEach(rep => {
                                if (rep.EstadosDetalhados) {
                                    Object.entries(rep.EstadosDetalhados).forEach(([estado, estadoData]) => {
                                        if (estadoData.cidades) {
                                            // Normalizar chave do estado para UF (sigla)
                                            let estadoCode = estado;
                                            if (typeof estado === 'string') {
                                                if (estado.length === 2) {
                                                    estadoCode = estado.toUpperCase();
                                                } else {
                                                    const mapped = getStateCodeByName(estado);
                                                    estadoCode = mapped || (estado || '').toString().substring(0, 2).toUpperCase();
                                                }
                                            }
                                            estadoCode = (estadoCode || '').toUpperCase();

                                            estadoData.cidades.forEach(cidade => {
                                                if (!cidadesPorEstado.has(cidade)) {
                                                    cidadesPorEstado.set(cidade, []);
                                                }
                                                const estadosList = cidadesPorEstado.get(cidade);
                                                if (!estadosList.includes(estadoCode)) {
                                                    estadosList.push(estadoCode);
                                                }
                                            });
                                        }
                                    });
                                }
                            });

                            // Agora gerar sugestões com sigla do estado
                            const cidadesOrdenadas = [];

                            cidadesPorEstado.forEach((estados, cidade) => {
                                // Se o padrão "cidade UF" foi detectado, restringir por UF e usar apenas a parte da cidade na comparação
                                const termoCidadeParaMatch = cidadeParte ? cidadeParte : query;
                                // Usar a função global de busca rigorosa para o autocomplete
                                const matchResult = strictSearch(termoCidadeParaMatch, cidade, {
                                    minLength: 4,
                                    useStartsWith: true,
                                    maxSimilarity: 0.9,
                                    maxLengthDiff: 2
                                });

                                // Se UF foi informada, somente considerar cidades presentes nessa UF
                                const passaFiltroUf = ufParte ? estados.includes(ufParte) : true;
                                if (matchResult.match && passaFiltroUf) {
                                    // CORREÇÃO: Priorizar cidades do estado atual se disponível
                                    let priority = matchResult.score;

                                    // BONUS de prioridade para cidades do estado atual
                                    if (currentState && currentState.code && estados.includes(currentState.code)) {
                                        priority += 50; // Prioridade máxima para estado atual
                                    }
                                    // BONUS alto se a query incluiu explicitamente a UF e a cidade pertence a essa UF
                                    if (ufParte && estados.includes(ufParte)) {
                                        priority += 60;
                                    }

                                    // BONUS para correspondência exata
                                    if (matchResult.type === 'exact') {
                                        priority += 20;
                                    }

                                    // BONUS para correspondência parcial rigorosa
                                    if (matchResult.type === 'partial') {
                                        priority += 10;
                                    }

                                    // PENALIDADE para correspondência similar (evitar falsos positivos)
                                    if (matchResult.type === 'similar') {
                                        priority -= 30;
                                    }

                                    cidadesOrdenadas.push({
                                        cidade,
                                        estados,
                                        similarity: matchResult.score / 100,
                                        priority
                                    });
                                }
                            });

                            // Ordenar por prioridade (maior primeiro)
                            cidadesOrdenadas.sort((a, b) => b.priority - a.priority);

                            // Adicionar sugestões respeitando o limite máximo
                            cidadesOrdenadas.forEach(({ cidade, estados, similarity, priority }) => {
                                if (suggestions.length >= maxSuggestions) return;

                                // Quando a cidade existe em múltiplos estados, gerar uma sugestão por UF
                                const estadosFiltrados = ufParte ? estados.filter(e => e === ufParte) : estados.slice();

                                // Ordenar para priorizar o estado atual e depois manter ordem estável
                                estadosFiltrados.sort((a, b) => {
                                    const aIsCurrent = currentState && currentState.code === a ? 1 : 0;
                                    const bIsCurrent = currentState && currentState.code === b ? 1 : 0;
                                    const aIsUfQuery = ufParte && ufParte === a ? 1 : 0;
                                    const bIsUfQuery = ufParte && ufParte === b ? 1 : 0;
                                    return (bIsCurrent + bIsUfQuery) - (aIsCurrent + aIsUfQuery);
                                });

                                estadosFiltrados.forEach(est => {
                                    if (suggestions.length < maxSuggestions) {
                                        const extra = (currentState && currentState.code === est ? 10 : 0) + (ufParte && ufParte === est ? 10 : 0);
                                        suggestions.push({
                                            type: 'cidade',
                                            text: `${cidade} (${est})`,
                                            originalText: cidade,
                                            estados: [est],
                                            similarity,
                                            priority: priority + extra
                                        });
                                    }
                                });
                            });

                            // CORREÇÃO: Adicionar sugestões combinadas para cidades populares
                            if (normalizedQuery.startsWith('bele') && normalizedQuery.length >= 4 && suggestions.length < maxSuggestions) {
                                // Se a query começa com "bele" e tem pelo menos 4 caracteres, sugerir "Belém Pará" e "Belém Paraíba"
                                if (!suggestions.some(s => s.text.includes('Belém (PA)'))) {
                                    suggestions.push({
                                        type: 'cidade',
                                        text: 'Belém (PA)',
                                        originalText: 'Belém Pará',
                                        estados: ['PA'],
                                        similarity: 0.9,
                                        priority: 8
                                    });
                                }

                                if (!suggestions.some(s => s.text.includes('Belém (PB)'))) {
                                    suggestions.push({
                                        type: 'cidade',
                                        text: 'Belém (PB)',
                                        originalText: 'Belém Paraíba',
                                        estados: ['PB'],
                                        similarity: 0.9,
                                        priority: 7
                                    });
                                }
                            }
                        }

                        // 3. Bairros de São Paulo
                        if (currentSearchFilter === 'all' || currentSearchFilter === 'bairros') {
                            const bairrosSet = new Set();
                            representativesData.forEach(rep => {
                                if (rep.EstadosDetalhados && rep.EstadosDetalhados.SP && rep.EstadosDetalhados.SP.bairros) {
                                    rep.EstadosDetalhados.SP.bairros.forEach(bairro => {
                                        // Usar a função global de busca rigorosa para bairros
                                        const matchResult = strictSearch(query, bairro, {
                                            minLength: 4,
                                            useStartsWith: true,
                                            maxSimilarity: 0.9,
                                            maxLengthDiff: 2
                                        });

                                        if (matchResult.match && !bairrosSet.has(bairro) && suggestions.length < maxSuggestions) {
                                            bairrosSet.add(bairro);

                                            // Calcular prioridade baseada no tipo de match
                                            let priority = 5;
                                            if (matchResult.type === 'exact') {
                                                priority = 5;
                                            } else if (matchResult.type === 'partial') {
                                                priority = 3;
                                            } else if (matchResult.type === 'similar') {
                                                priority = 1;
                                            }

                                            suggestions.push({
                                                type: 'bairro',
                                                text: bairro + ' (SP)',
                                                originalText: bairro,
                                                similarity: matchResult.score / 100,
                                                priority: priority
                                            });
                                        }
                                    });
                                }
                            });
                        }

                        // 4. Representantes
                        if (currentSearchFilter === 'all' || currentSearchFilter === 'representantes') {
                            representativesData.forEach(rep => {
                                // Usar a função global de busca rigorosa para representantes
                                const matchResult = strictSearch(query, rep.NomeRepresentante, {
                                    minLength: 4,
                                    useStartsWith: true,
                                    maxSimilarity: 0.9,
                                    maxLengthDiff: 2
                                });

                                if (matchResult.match && suggestions.length < maxSuggestions) {
                                    // Calcular prioridade baseada no tipo de match
                                    let priority = 5;
                                    if (matchResult.type === 'exact') {
                                        priority = 5;
                                    } else if (matchResult.type === 'partial') {
                                        priority = 3;
                                    } else if (matchResult.type === 'similar') {
                                        priority = 1;
                                    }

                                    suggestions.push({
                                        type: 'representante',
                                        text: rep.NomeRepresentante,
                                        similarity: matchResult.score / 100,
                                        priority: priority
                                    });
                                }
                            });
                        }

                        // 5. Sugestões combinadas inteligentes (termos combinados)
                        if (query.length >= 4 && suggestions.length < maxSuggestions - 2) {
                            // CORREÇÃO: Gerar sugestões combinadas inteligentes baseadas na query
                            // Aumentar comprimento mínimo para evitar sugestões muito genéricas
                            const termosCombinados = generateCombinedSuggestions(normalizedQuery, currentState);

                            termosCombinados.forEach(combinacao => {
                                if (suggestions.length < maxSuggestions) {
                                    suggestions.push({
                                        type: 'combinado',
                                        text: combinacao.text,
                                        originalText: combinacao.originalText,
                                        estados: combinacao.estados,
                                        similarity: combinacao.similarity,
                                        priority: combinacao.priority
                                    });
                                }
                            });
                        }

                        // Ordenar por prioridade e similaridade
                        return suggestions
                            .sort((a, b) => {
                                if (a.priority !== b.priority) return b.priority - a.priority;
                                return b.similarity - a.similarity;
                            })
                            .slice(0, maxSuggestions);
                    }

                    // Função para gerar sugestões combinadas inteligentes
                    function generateCombinedSuggestions(normalizedQuery, currentState) {
                        const combinacoes = [];

                        // 1. Padrões de cidade + estado (ex: "belém pará", "belém do pará")
                        const padraoCidadeEstado = /^(.+?)\s+(?:do\s+)?([a-z]{2}|pará|são paulo|rio de janeiro|minas gerais|bahia|paraná|rio grande do sul|pernambuco|ceará|santa catarina|goiás|maranhão|paraíba|amazonas|espírito santo|mato grosso|alagoas|piauí|distrito federal|mato grosso do sul|sergipe|rio grande do norte|rondônia|acre|amapá|roraima|tocantins)$/i;

                        if (padraoCidadeEstado.test(normalizedQuery)) {
                            const match = normalizedQuery.match(padraoCidadeEstado);
                            const cidade = match[1].trim();
                            const estado = match[2].trim();

                            // Converter nome do estado para sigla
                            const stateToAbbrev = {
                                'pará': 'PA', 'são paulo': 'SP', 'rio de janeiro': 'RJ', 'minas gerais': 'MG',
                                'bahia': 'BA', 'paraná': 'PR', 'rio grande do sul': 'RS', 'pernambuco': 'PE',
                                'ceará': 'CE', 'santa catarina': 'SC', 'goiás': 'GO', 'maranhão': 'MA',
                                'paraíba': 'PB', 'amazonas': 'AM', 'espírito santo': 'ES', 'mato grosso': 'MT',
                                'alagoas': 'AL', 'piauí': 'PI', 'distrito federal': 'DF', 'mato grosso do sul': 'MS',
                                'sergipe': 'SE', 'rio grande do norte': 'RN', 'rondônia': 'RO', 'acre': 'AC',
                                'amapá': 'AP', 'roraima': 'RR', 'tocantins': 'TO'
                            };

                            const siglaEstado = stateToAbbrev[estado] || estado.toUpperCase();

                            // Verificar se a cidade existe no estado usando busca rigorosa
                            const cidadeExiste = verificarCidadeNoEstado(cidade, siglaEstado);
                            if (cidadeExiste) {
                                // Usar a função rigorosa para calcular similaridade real
                                const matchResult = strictSearch(cidade, cidade, {
                                    minLength: 4,
                                    useStartsWith: true,
                                    maxSimilarity: 0.9,
                                    maxLengthDiff: 2
                                });

                                combinacoes.push({
                                    text: `${cidade.charAt(0).toUpperCase() + cidade.slice(1)} (${siglaEstado})`,
                                    originalText: `${cidade} ${estado}`,
                                    estados: [siglaEstado],
                                    similarity: matchResult.score / 100,
                                    priority: 5
                                });
                            }
                        }

                        // 2. Padrões de representante + estado (ex: "schioppa pará", "3l são paulo")
                        const padraoRepEstado = /^(.+?)\s+(?:em\s+)?([a-z]{2}|pará|são paulo|rio de janeiro|minas gerais|bahia|paraná|rio grande do sul|pernambuco|ceará|santa catarina|goiás|maranhão|paraíba|amazonas|espírito santo|mato grosso|alagoas|piauí|distrito federal|mato grosso do sul|sergipe|rio grande do norte|rondônia|acre|amapá|roraima|tocantins)$/i;

                        if (padraoRepEstado.test(normalizedQuery)) {
                            const match = normalizedQuery.match(padraoRepEstado);
                            const representante = match[1].trim();
                            const estado = match[2].trim();

                            const stateToAbbrev = {
                                'pará': 'PA', 'são paulo': 'SP', 'rio de janeiro': 'RJ', 'minas gerais': 'MG',
                                'bahia': 'BA', 'paraná': 'PR', 'rio grande do sul': 'RS', 'pernambuco': 'PE',
                                'ceará': 'CE', 'santa catarina': 'SC', 'goiás': 'GO', 'maranhão': 'MA',
                                'paraíba': 'PB', 'amazonas': 'AM', 'espírito santo': 'ES', 'mato grosso': 'MT',
                                'alagoas': 'AL', 'piauí': 'PI', 'distrito federal': 'DF', 'mato grosso do sul': 'MS',
                                'sergipe': 'SE', 'rio grande do norte': 'RN', 'rondônia': 'RO', 'acre': 'AC',
                                'amapá': 'AP', 'roraima': 'RR', 'tocantins': 'TO'
                            };

                            const siglaEstado = stateToAbbrev[estado] || estado.toUpperCase();

                            // Verificar se o representante atende o estado
                            const repAtendeEstado = verificarRepresentanteNoEstado(representante, siglaEstado);
                            if (repAtendeEstado) {
                                combinacoes.push({
                                    text: `${representante.charAt(0).toUpperCase() + representante.slice(1)} em ${estado.charAt(0).toUpperCase() + estado.slice(1)}`,
                                    originalText: `${representante} ${estado}`,
                                    estados: [siglaEstado],
                                    similarity: 0.9,
                                    priority: 4
                                });
                            }
                        }

                        // 3. Sugestões contextuais baseadas no estado atual
                        if (currentState && currentState.code) {
                            // Se o usuário está no Pará, sugerir "Belém Pará"
                            if (currentState.code === 'PA' && normalizedQuery.startsWith('bele') && normalizedQuery.length >= 4) {
                                combinacoes.push({
                                    text: 'Belém (PA)',
                                    originalText: 'Belém Pará',
                                    estados: ['PA'],
                                    similarity: 0.9,
                                    priority: 6
                                });
                            }

                            // Se o usuário está na Paraíba, sugerir "Belém Paraíba"
                            if (currentState.code === 'PB' && normalizedQuery.startsWith('bele') && normalizedQuery.length >= 4) {
                                combinacoes.push({
                                    text: 'Belém (PB)',
                                    originalText: 'Belém Paraíba',
                                    estados: ['PB'],
                                    similarity: 0.9,
                                    priority: 6
                                });
                            }
                        }

                        return combinacoes;
                    }

                    // Função para verificar se uma cidade existe em um estado
                    function verificarCidadeNoEstado(cidade, estado) {
                        const normalizedCidade = normalize(cidade);

                        let encontrou = false;
                        let representantesEncontrados = [];

                        representativesData.forEach(rep => {
                            if (rep.EstadosDetalhados && rep.EstadosDetalhados[estado] && rep.EstadosDetalhados[estado].cidades) {
                                const cidades = rep.EstadosDetalhados[estado].cidades;

                                cidades.forEach(c => {
                                    const normalizedC = normalize(c);
                                    // Usar match exato para evitar falsos positivos
                                    if (normalizedC === normalizedCidade) {
                                        encontrou = true;
                                        representantesEncontrados.push(rep.NomeRepresentante);
                                    }
                                });
                            }
                        });

                        return encontrou;
                    }

                    // Função para verificar se um representante atende um estado
                    function verificarRepresentanteNoEstado(representante, estado) {
                        const normalizedRep = normalize(representante);

                        return representativesData.some(rep => {
                            const normalizedNome = normalize(rep.NomeRepresentante);
                            // Usar a função rigorosa para evitar falsos positivos
                            const matchResult = strictSearch(normalizedRep, normalizedNome, {
                                minLength: 4,
                                useStartsWith: true,
                                maxSimilarity: 0.9,
                                maxLengthDiff: 2
                            });

                            if (matchResult.match) {
                                return rep.EstadosDetalhados && rep.EstadosDetalhados[estado];
                            }
                            return false;
                        });
                    }

                        // Adicionar instrução sutil no final das sugestões
                        if (suggestions.length > 0) {

                            instructionItem.innerHTML = 'Clique em uma sugestão ou pressione Enter para buscar';

                        searchSuggestions = suggestions;

                        searchInput.classList.add('has-suggestions');

                        // Inicializar ícones Lucide para as novas sugestões

                    // Esconder sugestões
                    function hideSuggestions() {
                        suggestionsContainer.classList.add('hidden');
                        selectedSuggestionIndex = -1;

                    // Função para fazer refresh completo antes de processar nova sugestão
                    function refreshForNewSuggestion() {
                        console.log('🔄 REFRESH: Limpando estado anterior para nova sugestão');

                        // 1. Reset visual completo do mapa
                        if (selectedStateLayer) {
                            geoJsonLayer.resetStyle(selectedStateLayer);

                        if (bairrosLayer && map.hasLayer(bairrosLayer)) {

                        }

                        // 3. Reset de estado e modo
                        currentState = null;
                        viewMode = 'states';

                        // 4. Reset visual dos estados para azul padrão
                        geoJsonLayer.eachLayer(layer => {
                            layer.setStyle(defaultMapStyle);
                        });

                        // 5. Reset do mapa para visualização geral
                        map.setView([-15.78, -47.92], 4);

                        // 6. Limpar resultados e legenda
                        updateLegend([]);
                        resultsContainer.innerHTML = '<div class="text-center text-gray-500 py-8">Processando nova busca...</div>';

                        // 7. Reset do título
                        mainTitle.textContent = 'Escolha sua região para encontrar representantes';

                        return new Promise(resolve => setTimeout(resolve, 100));

                    // Selecionar sugestão
                    async function selectSuggestion(suggestion) {

                        searchInput.value = textToUse;

                        await refreshForNewSuggestion();

                        // TRATAMENTO ESPECÍFICO POR TIPO DE SUGESTÃO
                        if (suggestion.type === 'bairro') {
                            // Para bairros, invocar diretamente o filtro de bairro para evitar ser tratado como cidade
                            const bairroNome = suggestion.originalText || (suggestion.text || '').replace(/\s*\(SP\)\s*$/i, '');

                            // Fazer zoom no bairro (São Paulo) - SEM refresh interno
                            zoomToBairro(bairroNome, false);

                            filterByBairro(bairroNome, true); // skipRefresh = true
                            addToRecentSearches(textToUse);
                            return;
                        }

                        if (suggestion.type === 'cidade') {
                            // CORREÇÃO: Para cidades, usar o filtro de município diretamente
                            const cidadeNome = suggestion.originalText || suggestion.text.replace(/\s*\([A-Z]{2}\)\s*$/i, '');

                            // Se a cidade tem estados específicos, usar o primeiro para contexto
                            if (suggestion.estados && suggestion.estados.length > 0) {
                                const estadoCidade = suggestion.estados[0];

                                // Fazer zoom na cidade específica - SEM refresh interno
                                zoomToCidade(cidadeNome, estadoCidade, false);

                                // Definir o estado atual para a busca
                                if (currentState && currentState.code !== estadoCidade) {
                                    // Aqui você pode implementar a lógica para alterar o estado atual se necessário
                                }
                            } else {
                                // Se não tem estado específico, tentar fazer zoom na cidade - SEM refresh interno
                                zoomToCidade(cidadeNome, null, false);
                            }

                            filterByMunicipio(cidadeNome, true); // skipRefresh = true
                            addToRecentSearches(textToUse);
                            return;
                        }

                        if (suggestion.type === 'combinado') {
                            // CORREÇÃO: Para sugestões combinadas, processar inteligentemente

                            if (suggestion.estados && suggestion.estados.length > 0) {
                                const estadoCombinado = suggestion.estados[0];

                                // Se for uma cidade + estado, usar o filtro de município
                                if (suggestion.originalText && suggestion.originalText.includes(' ')) {
                                    const partes = suggestion.originalText.split(' ');
                                    if (partes.length >= 2) {
                                        const cidade = partes[0];
                                        filterByMunicipio(cidade);
                                        addToRecentSearches(textToUse);
                                        return;
                                    }
                                }
                            }

                            // Fallback: usar busca normal
                            handleSearch(true); // skipRefresh = true
                            addToRecentSearches(textToUse);
                            return;
                        }

                        if (suggestion.type === 'estado') {
                            // Renderizar diretamente os representantes do estado selecionado (sem vazar)
                            const normalized = normalize(textToUse);
                            const stateToAbbrev = {
                                'sao paulo': 'SP', 'rio de janeiro': 'RJ', 'minas gerais': 'MG', 'bahia': 'BA',
                                'parana': 'PR', 'rio grande do sul': 'RS', 'pernambuco': 'PE', 'ceara': 'CE',
                                'para': 'PA', 'santa catarina': 'SC', 'goias': 'GO', 'maranhao': 'MA',
                                'paraiba': 'PB', 'amazonas': 'AM', 'espirito santo': 'ES', 'mato grosso': 'MT',
                                'alagoas': 'AL', 'piaui': 'PI', 'distrito federal': 'DF', 'mato grosso do sul': 'MS',
                                'sergipe': 'SE', 'rio grande do norte': 'RN', 'rondonia': 'RO', 'acre': 'AC',
                                'amapa': 'AP', 'roraima': 'RR', 'tocantins': 'TO'
                            };
                            const code = normalized.length === 2 ? textToUse.toUpperCase() : (stateToAbbrev[normalized] || null);
                            if (code) {
                                // Fazer zoom no estado
                                zoomToEstado(code);

                                renderRepresentativesForState(code, textToUse, true); // skipRefresh = true
                                addToRecentSearches(textToUse);
                                return;
                            }
                        }

                        // Para outros tipos, usar o fluxo normal de busca
                        handleSearch(true); // skipRefresh = true
                        addToRecentSearches(textToUse);
                    }

                    // Funções de zoom para sugestões do autocomplete
                    function zoomToEstado(estadoCode) {
                        console.log('zoomToEstado chamada para:', estadoCode);
                        // Encontrar o layer do estado
                        geoJsonLayer.eachLayer(layer => {
                            const feature = layer.feature;
                            const stateCode = getStateCode(feature.properties);

                                // Destacar o estado

                    function zoomToCidade(cidadeNome, estadoCode = null) {

                        // Se temos o estado, usar a função existente
                        if (estadoCode) {

                                const props = layer.feature.properties;
                                const name = props.name || props.nome || props.municipio || props.description;

                                if (name && normalize(name) === normalize(cidadeNome)) {
                                    console.log('Cidade encontrada nos municípios carregados:', name);
                                    // Fazer zoom no município
                                    const municipioBounds = layer.getBounds();
                                    map.fitBounds(municipioBounds, {
                                        padding: [50, 50],
                                        maxZoom: 12
                                    });

                                    // Destacar o município
                                    if (selectedMunicipioLayer) {
                                        municipiosLayer.resetStyle(selectedMunicipioLayer);
                                    }
                                    selectedMunicipioLayer = layer;
                                    layer.setStyle(municipioSelectedStyle);

                                    found = true;
                                }

                        // Se não encontrou, tentar carregar o estado primeiro

                                    for (const [estado, estadoData] of Object.entries(rep.estados)) {
                                        const cidades = estadoData.cidades || [];
                                        if (cidades.some(c => normalize(c) === normalize(cidadeNome))) {
                                            console.log('Cidade encontrada no estado:', estado, 'para cidade:', cidadeNome);
                                            // Encontrou a cidade, fazer zoom no estado e depois na cidade
                                            zoomToEstado(estado);

                                            // Aguardar o carregamento do estado e depois fazer zoom na cidade
                                            setTimeout(() => {
                                                console.log('Fazendo zoom na cidade após carregar estado');
                                                zoomToCidade(cidadeNome, estado);
                                            }, 1500); // Aumentei o timeout para 1.5s
                                            return;
                                        }
                                    }

                    }

                    function zoomToBairro(bairroNome) {
                        console.log('zoomToBairro chamada para:', bairroNome);

                        // Primeiro, garantir que estamos no estado de São Paulo
                        const stateCode = 'SP';
                        const stateName = 'São Paulo';

                        // Encontrar o estado de São Paulo no mapa
                        const stateFeature = geoJsonLayer.getLayers().find(layer => {

                    // Função para buscar em bairros de São Paulo
                    function searchInBairros(query, estadoAtual = 'SP') {
                        const foundIds = new Set();
                        const normalizedQuery = normalize(query);

                        // MÉTODO 1: Busca direta no municipioRepresentativeMap usando chave bairro+estado
                        const bairroEstadoKey = `${normalizedQuery}-${estadoAtual}`;
                        const directMatch = municipioRepresentativeMap.get(bairroEstadoKey);
                        if (directMatch && directMatch.length > 0) {
                            directMatch.forEach(rep => {
                                foundIds.add(rep.id);
                            });
                        }

                        // MÉTODO 2: Buscar APENAS em representantes do estado atual para evitar conflitos
                        // CORREÇÃO: Usar Set para evitar duplicatas e priorizar matches exatos
                        const matchesExatos = new Set();
                        const matchesParciais = new Set();
                        const matchesSimilares = new Set();

                        representativesData.forEach(rep => {
                            if (rep.EstadosDetalhados &&
                                rep.EstadosDetalhados[estadoAtual] &&
                                rep.EstadosDetalhados[estadoAtual].bairros) {

                                const bairros = rep.EstadosDetalhados[estadoAtual].bairros;

                                bairros.forEach(bairro => {
                                    const normalizedBairro = normalize(bairro);

                                    // Busca exata primeiro (prioridade máxima)
                                    if (normalizedBairro === normalizedQuery) {
                                        matchesExatos.add(rep.id);
                                        return;
                                    }

                                    // Busca por contém (prioridade média) - mais restritivo
                                    if (normalizedBairro.startsWith(normalizedQuery) && normalizedQuery.length >= 4) {
                                        // Verificar se não é apenas uma coincidência de caracteres
                                        matchesParciais.add(rep.id);
                                        return;
                                    }

                                    // Busca por similaridade (prioridade baixa) - muito mais restritivo
                                    const similarity = calculateSimilarity(normalizedBairro, normalizedQuery);
                                    if (similarity > 0.9 && !normalizedBairro.includes(normalizedQuery) && !normalizedQuery.includes(normalizedBairro)) {
                                        // Verificar se a diferença de comprimento não é muito grande
                                        const lengthDiff = Math.abs(normalizedBairro.length - normalizedQuery.length);
                                        if (lengthDiff <= 2) { // Máximo 2 caracteres de diferença
                                            matchesSimilares.add(rep.id);
                                        }
                                    }
                                });
                            }
                        });

                        // CORREÇÃO: Priorizar matches exatos, depois parciais, por último similares
                        // Evitar duplicatas e garantir que cada representante apareça apenas uma vez
                        matchesExatos.forEach(id => foundIds.add(id));

                        // Se não há matches exatos, adicionar parciais
                        if (foundIds.size === 0) {
                            matchesParciais.forEach(id => foundIds.add(id));
                        }

                        // Se ainda não há resultados, adicionar similares (limitado a 1 para evitar poluição)
                        if (foundIds.size === 0) {
                            let count = 0;
                            for (const id of matchesSimilares) {
                                if (count < 1) {
                                    foundIds.add(id);
                                    count++;
                                }
                            }
                        }

                        return foundIds;
                    }

                    // Função para buscar em cidades com diferenciação inteligente
                    function searchInCidades(query, estadoAtual = null) {
                        const foundIds = new Set();
                        const normalizedQuery = normalize(query);

                        // CORREÇÃO: Se estadoAtual é especificado, buscar APENAS nesse estado para evitar conflitos
                        if (estadoAtual) {
                            let totalRepsAnalisados = 0;
                            let totalCidadesAnalisadas = 0;

                            representativesData.forEach(rep => {
                                if (rep.EstadosDetalhados && rep.EstadosDetalhados[estadoAtual] && rep.EstadosDetalhados[estadoAtual].cidades) {
                                    totalRepsAnalisados++;
                                    const cidades = rep.EstadosDetalhados[estadoAtual].cidades;
                                    totalCidadesAnalisadas += cidades.length;

                                    cidades.forEach(cidade => {
                                        const normalizedCidade = normalize(cidade);

                                        // Match exato (prioridade máxima)
                                        if (normalizedCidade === normalizedQuery) {
                                            foundIds.add(rep.id);
                                            return;
                                        }

                                        // Match parcial (prioridade média) - mais restritivo
                                        if (normalizedCidade.startsWith(normalizedQuery) && normalizedQuery.length >= 4) {
                                            // Verificar se não é apenas uma coincidência de caracteres
                                            foundIds.add(rep.id);
                                            return;
                                        }

                                        // Match por similaridade (prioridade baixa) - muito mais restritivo
                                        const similarity = calculateSimilarity(normalizedCidade, normalizedQuery);
                                        if (similarity > 0.9 && !normalizedCidade.includes(normalizedQuery) && !normalizedQuery.includes(normalizedCidade)) {
                                            // Verificar se a diferença de comprimento não é muito grande
                                            const lengthDiff = Math.abs(normalizedCidade.length - normalizedQuery.length);
                                            if (lengthDiff <= 2) { // Máximo 2 caracteres de diferença
                                                foundIds.add(rep.id);
                                            }
                                        }
                                    });
                                }
                            });

                            return foundIds;
                        }

                        // Se não há estado especificado, usar a lógica anterior para busca em todos os estados
                        const exactMatches = [];
                        const partialMatches = [];
                        const similarMatches = [];

                        // Coletar todas as cidades únicas com seus estados
                        const cidadesUnicas = new Map(); // cidade -> [estados]

                        representativesData.forEach(rep => {
                            if (rep.EstadosDetalhados) {
                                Object.entries(rep.EstadosDetalhados).forEach(([estado, dadosEstado]) => {
                                    if (dadosEstado.cidades && Array.isArray(dadosEstado.cidades)) {
                                        dadosEstado.cidades.forEach(cidade => {
                                            const normalizedCidade = normalize(cidade);
                                            if (!cidadesUnicas.has(normalizedCidade)) {
                                                cidadesUnicas.set(normalizedCidade, []);
                                            }
                                            if (!cidadesUnicas.get(normalizedCidade).includes(estado)) {
                                                cidadesUnicas.get(normalizedCidade).push(estado);
                                            }
                                        });
                                    }
                                });
                            }
                        });

                        // Classificar as cidades por tipo de match
                        for (const [cidade, estados] of cidadesUnicas.entries()) {
                            // 1. Match exato (prioridade máxima)
                            if (cidade === normalizedQuery) {
                                exactMatches.push({ cidade, estados });
                            }
                            // 2. Match parcial (começa com a query) - mais restritivo
                            else if (cidade.startsWith(normalizedQuery) && normalizedQuery.length >= 4) {
                                // Verificar se não é apenas uma coincidência de caracteres
                                // A cidade deve começar exatamente com a query para evitar falsos positivos
                                partialMatches.push({ cidade, estados });
                            }
                            // 3. Match por similaridade - muito mais restritivo
                            else {
                                const similarity = calculateSimilarity(cidade, normalizedQuery);
                                // Aumentar threshold para 90% e verificar se não é apenas uma coincidência
                                if (similarity > 0.9 && !cidade.includes(normalizedQuery) && !normalizedQuery.includes(cidade)) {
                                    // Verificar se a diferença de comprimento não é muito grande
                                    const lengthDiff = Math.abs(cidade.length - normalizedQuery.length);
                                    if (lengthDiff <= 2) { // Máximo 2 caracteres de diferença
                                        similarMatches.push({ cidade, estados, similarity });
                                    }
                                }
                            }
                        }

                        // Ordenar matches similares por similaridade
                        similarMatches.sort((a, b) => b.similarity - a.similarity);

                        // Processar matches exatos primeiro
                        exactMatches.forEach(({ cidade, estados }) => {
                            const representatives = getRepresentativesByCidade(cidade, estados);
                            representatives.forEach(rep => foundIds.add(rep.id));
                        });

                        // Se não há matches exatos, processar parciais (mais restritivo)
                        if (exactMatches.length === 0 && partialMatches.length > 0) {
                            // Limitar a apenas 1 match parcial para evitar poluição
                            partialMatches.slice(0, 1).forEach(({ cidade, estados }) => {
                                const representatives = getRepresentativesByCidade(cidade, estados);
                                representatives.forEach(rep => foundIds.add(rep.id));
                            });
                        }

                        // Se ainda não há resultados, processar similares (muito restritivo)
                        if (foundIds.size === 0 && similarMatches.length > 0) {
                            // Limitar a apenas 1 match similar para evitar poluição
                            similarMatches.slice(0, 1).forEach(({ cidade, estados }) => {
                                const representatives = getRepresentativesByCidade(cidade, estados);
                                representatives.forEach(rep => foundIds.add(rep.id));
                            });
                        }

                        return foundIds;
                    }

                    // Função para obter representantes por cidade e estados
                    function getRepresentativesByCidade(cidade, estados) {
                        const representatives = [];

                        representativesData.forEach(rep => {
                            if (rep.EstadosDetalhados) {
                                Object.entries(rep.EstadosDetalhados).forEach(([estado, dadosEstado]) => {
                                    if (estados.includes(estado) && dadosEstado.cidades && Array.isArray(dadosEstado.cidades)) {
                                        if (dadosEstado.cidades.some(c => normalize(c) === cidade)) {
                                            representatives.push(rep);
                                        }
                                    }
                                });
                            }
                        });

                        return representatives;
                    }

                    // Função para buscar representantes por localização específica
                    function getRepresentativesByLocation(location) {
                        const repIds = representativesByLocation.get(location) || new Set();
                        return representativesData.filter(rep => repIds.has(rep.id));
                    }

                    function handleGlobalMapClick(e) {
                        const latlng = e.latlng;

                        // Função para verificar se um ponto está dentro de um polígono (ray casting)
                        function pointInPolygon(point, polygon) {
                            const x = point.lat, y = point.lng;
                            let inside = false;

                            // Log para debug
                            if (polygon.length < 3) {
                                return false;
                            }

                            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                                const xi = polygon[i].lat, yi = polygon[i].lng;
                                const xj = polygon[j].lat, yj = polygon[j].lng;

                                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
                                    inside = !inside;
                                }
                            }
                            return inside;
                        }

                        // Função para calcular a distância entre dois pontos
                        function calculateDistance(point1, point2) {
                            const dx = point1.lat - point2.lat;
                            const dy = point1.lng - point2.lng;
                            return Math.sqrt(dx * dx + dy * dy);
                        }

                        // Função para encontrar o município mais próximo de um ponto
                        function findNearestMunicipio(point, municipiosData) {
                            let nearestMunicipio = null;
                            let minDistance = Infinity;

                            for (const feature of municipiosData.features) {
                                if (feature.geometry.type === 'Polygon') {
                                    // Calcular distância para o centro do polígono
                                    const coords = feature.geometry.coordinates[0];
                                    const center = {
                                        lat: coords.reduce((sum, coord) => sum + coord[1], 0) / coords.length,
                                        lng: coords.reduce((sum, coord) => sum + coord[0], 0) / coords.length
                                    };

                                    const distance = calculateDistance(point, center);
                                    if (distance < minDistance) {
                                        minDistance = distance;
                                        nearestMunicipio = feature;
                                    }
                                } else if (feature.geometry.type === 'MultiPolygon') {
                                    for (let polygon of feature.geometry.coordinates) {
                                        const coords = polygon[0];
                                        const center = {
                                            lat: coords.reduce((sum, coord) => sum + coord[1], 0) / coords.length,
                                            lng: coords.reduce((sum, coord) => sum + coord[0], 0) / coords.length
                                        };

                                        const distance = calculateDistance(point, center);
                                        if (distance < minDistance) {
                                            minDistance = distance;
                                            nearestMunicipio = feature;
                                        }
                                    }
                                }
                            }

                            return { municipio: nearestMunicipio, distance: minDistance };
                        }

                        // Verificar bairros PRIMEIRO se a camada estiver disponível e visível
                        if (bairrosLayer && map.hasLayer(bairrosLayer)) {
                            let clickedBairro = null;

                            bairrosLayer.eachLayer(layer => {
                                if (layer.getBounds().contains(latlng)) {
                                    const feature = layer.feature;
                                    if (feature.geometry.type === 'Polygon') {
                                        const coords = feature.geometry.coordinates[0].map(coord => ({ lat: coord[1], lng: coord[0] }));

                    function setupEventListeners() {
                        let debounceTimeout;
                        let suggestionTimeout;

                        // Input da busca com sugestões
                        searchInput.addEventListener('input', function () {
                            const query = this.value.trim();

                            // Mostrar/esconder botão de limpar
                            if (query) {
                                clearSearchButton.classList.remove('hidden');
                            } else {
                                clearSearchButton.classList.add('hidden');
                                hideSuggestions();
                            }

                            // Gerar sugestões com debounce menor
                            clearTimeout(suggestionTimeout);
                            if (query.length >= 2) {
                                suggestionTimeout = setTimeout(() => {
                                    const suggestions = generateSuggestions(query);
                                    showSuggestions(suggestions);
                                }, 150);
                            } else {
                                hideSuggestions();
                            }

                            // Remover busca automática - só buscar quando usuário clicar ou pressionar Enter
                            clearTimeout(debounceTimeout);
                        });

                        // Navegação por teclado nas sugestões
                        searchInput.addEventListener('keydown', function (e) {
                            if (searchSuggestions.length === 0) return;

                            switch (e.key) {
                                case 'ArrowDown':
                                    e.preventDefault();
                                    selectedSuggestionIndex = Math.min(selectedSuggestionIndex + 1, searchSuggestions.length - 1);
                                    updateSuggestionHighlight();
                                    break;
                                case 'ArrowUp':
                                    e.preventDefault();
                                    selectedSuggestionIndex = Math.max(selectedSuggestionIndex - 1, -1);
                                    updateSuggestionHighlight();
                                    break;
                                case 'Enter':
                                    e.preventDefault();
                                    if (selectedSuggestionIndex >= 0) {
                                        selectSuggestion(searchSuggestions[selectedSuggestionIndex]);
                                    } else if (searchSuggestions.length === 0 || suggestionsContainer.classList.contains('hidden')) {
                                        // Só executa busca se não há sugestões visíveis
                                        hideSuggestions();
                                        handleSearch();
                                        if (this.value.trim()) {
                                            addToRecentSearches(this.value.trim());
                                        }
                                    }
                                    // Se há sugestões visíveis, não faz nada - usuário deve escolher uma sugestão
                                    break;
                                case 'Escape':
                                    hideSuggestions();
                                    break;
                            }
                        });

                        // Focus no input para mostrar histórico
                        searchInput.addEventListener('focus', function () {
                            if (!this.value && recentSearchesData.length > 0) {
                                updateRecentSearchesDisplay();
                            }
                        });

                        // Botão de limpar busca
                        clearSearchButton.addEventListener('click', function () {
                            searchInput.value = '';
                            clearSearchButton.classList.add('hidden');
                            hideSuggestions();
                            resetView(true);
                            searchInput.focus();
                        });

                        // Filtros de busca
                        searchFilters.forEach(filter => {
                            filter.addEventListener('click', function () {
                                // Atualizar filtro ativo
                                searchFilters.forEach(f => f.classList.remove('active'));
                                this.classList.add('active');
                                currentSearchFilter = this.dataset.filter;

                                // Regenerar sugestões se há texto
                                if (searchInput.value.trim().length >= 2) {
                                    const suggestions = generateSuggestions(searchInput.value.trim());
                                    showSuggestions(suggestions);
                                }

                                // Re-executar busca se há resultados
                                if (searchInput.value.trim()) {
                                    handleSearch();
                                }
                            });
                        });

                        // Clique fora das sugestões para esconder (com delay para dar tempo de clicar)
                        document.addEventListener('click', function (e) {
                            if (!suggestionsContainer.contains(e.target) && e.target !== searchInput) {
                                // Pequeno delay para permitir cliques nas sugestões
                                setTimeout(() => {
                                    if (!suggestionsContainer.contains(document.activeElement)) {
                                        hideSuggestions();
                                        recentSearches.classList.add('hidden');
                                    }
                                }, 100);
                            }
                        });

                        backButton.addEventListener('click', resetView);

                        // Event listener para o botão de reset zoom
                        const resetZoomBtn = document.getElementById('reset-zoom-btn');
                        resetZoomBtn.addEventListener('click', function () {
                            resetView(false); // false para não limpar a busca
                        });

                        // Event listener para o botão de maximizar mapa
                        const maximizeMapBtn = document.getElementById('maximize-map-btn');
                        maximizeMapBtn.addEventListener('click', function () {
                            toggleMapMaximize();
                        });
                    }

                    // --- ESTILOS DO MAPA ---

                    const defaultMapStyle = { fillColor: "#3b82f6", weight: 1, opacity: 1, color: 'white', fillOpacity: 0.7 };
                    const highlightMapStyle = { weight: 0, color: '#fbbf24', fillOpacity: 0.9 };
                    const selectedMapStyle = { fillColor: "#fbbf24", fillOpacity: 1 };
                    const municipioSelectedStyle = { fillColor: "#fbbf24", weight: 2, opacity: 1, color: '#f59e0b', fillOpacity: 0.9 };

                    // Função para obter estilo do município baseado no representante
                    function getMunicipioStyleByRepresentative(municipioName, municipioState = null) {
                        const normalizedName = normalize(municipioName);

                        // Se não estamos no modo municípios, usar cor azul padrão
                        if (viewMode !== 'municipios') {
                            return {
                                fillColor: "#3b82f6",
                                weight: 1,
                                opacity: 1,
                                color: 'white',
                                fillOpacity: 0.6
                            };
                        }

                        // LÓGICA CORRETA: 
                        // - Municípios do estado selecionado: coloridos conforme representantes
                        // - Municípios de outros estados: azul padrão

                        // Se não há estado selecionado, usar azul padrão
                        if (!currentState || !currentState.code) {
                            console.log(`⚠️ Sem estado selecionado para ${municipioName}, usando AZUL`);
                            return {
                                fillColor: "#3b82f6",
                                weight: 1,
                                opacity: 1,
                                color: 'white',
                                fillOpacity: 0.6
                            };
                        }

                        // Se o município não pertence ao estado selecionado, usar azul padrão
                        if (municipioState && municipioState !== currentState.code) {
                            console.log(`🚫 Município ${municipioName} (${municipioState}) não pertence ao estado selecionado ${currentState.code}, usando AZUL`);
                            return {
                                fillColor: "#3b82f6",
                                weight: 1,
                                opacity: 1,
                                color: 'white',
                                fillOpacity: 0.6
                            };
                        }

                        // Buscar representantes apenas para municípios do estado selecionado
                        const cidadeEstadoKey = `${normalizedName}-${currentState.code.toLowerCase()}`;
                        const representatives = municipioRepresentativeMap.get(cidadeEstadoKey) || [];

                        console.log(`🔍 Buscando representantes para ${municipioName} no estado ${currentState.code}: ${representatives.length} encontrados`);

                        if (representatives.length === 0) {
                            // Município sem representante - cor azul padrão
                            console.log(`🔵 Município ${municipioName} sem representantes, usando AZUL`);
                            return {
                                fillColor: "#3b82f6",
                                weight: 1,
                                opacity: 1,
                                color: 'white',
                                fillOpacity: 0.6
                            };
                        }

                        // Se há representantes, usar a cor do primeiro
                        const primaryRepresentative = representatives[0];
                        const color = representativeColorMap.get(primaryRepresentative.id) || '#3b82f6';

                        console.log(`🎨 Aplicando cor ${color} para município ${municipioName} (representante: ${primaryRepresentative.NomeRepresentante})`);

                        return {
                            fillColor: color,
                            weight: 1,
                            opacity: 1,
                            color: 'white',
                            fillOpacity: representatives.length > 1 ? 0.8 : 0.6
                        };
                    }

                    // Agora usamos apenas cores diretas sem hover

    <!DOCTYPE html>
    <html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Encontre Nossos Representantes</title>

        <!-- Dependências do Mapa (Leaflet.js) -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

        <!-- Estilização com Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <!-- Lucide Icons -->
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

        <style>
            /* Remover todos os outlines de focus */
            * {
                outline: none !important;
            }

            /* Remover focus específico de botões e inputs */
            button:focus,
            input:focus,
            select:focus,
            textarea:focus {
                outline: none !important;
                box-shadow: none !important;
            }

            body,
            html {
                height: 100vh;
                margin: 0;
                font-family: 'Inter', sans-serif;
                background-color: #f8fafc;
                overflow-x: hidden;
            }

            #representantes-container {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .main-content {
                flex: 1;
                display: flex;
                flex-direction: column;
            }

            .grid-container {
                flex: 1;
                display: grid;
                gap: 1rem;
                grid-template-columns: 1fr;
                min-height: 0;
            }

            @media (min-width: 1024px) {
                .grid-container {
                    grid-template-columns: 3fr 2fr;
                    gap: 2rem;
                }
            }

            .map-container {
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            .map-wrapper {
                flex: 1;
                background: white;
                border-radius: 0.5rem;
                box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
                padding: 1rem;
                position: relative;
                min-height: 300px;
            }

            #map {
                height: 100%;
                width: 100%;
                border-radius: 0.5rem;
                background-color: #fff;
                min-height: 300px;
            }

            @media (min-width: 768px) {
                #map {
                    min-height: 400px;
                }
            }

            @media (min-width: 1024px) {
                #map {
                    min-height: calc(100vh - 200px);
                }
            }

            .sidebar {
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            .sidebar-content {
                background: white;
                border-radius: 0.5rem;
                box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
                padding: 1.5rem;
                display: flex;
                flex-direction: column;
                height: 100%;
            }

            .results-container {
                flex: 1;
                overflow-y: auto;
                min-height: 200px;
                max-height: 400px;
            }

            @media (min-width: 1024px) {
                .results-container {
                    max-height: calc(100vh - 300px);
                }
            }

            @media (max-height: 600px) {
                .results-container {
                    max-height: 250px;
                }

                #map {
                    min-height: 250px;
                }
            }

            /* Melhorias para dispositivos móveis muito pequenos */
            @media (max-width: 480px) {
                #representantes-container {
                    padding: 0.5rem;
                }

                .main-content {
                    gap: 0.5rem;
                }

                .map-wrapper {
                    padding: 0.5rem;
                }

                .sidebar-content {
                    padding: 1rem;
                }

                .results-container {
                    max-height: 300px;
                }
            }

            @media (max-width: 480px) and (max-height: 700px) {
                #map {
                    min-height: 200px;
                }

                .results-container {
                    max-height: 200px;
                }
            }

            /* Ajustes para orientação landscape em dispositivos móveis */
            @media (max-height: 500px) and (orientation: landscape) {
                .grid-container {
                    grid-template-columns: 1fr 1fr;
                    gap: 0.5rem;
                }

                #map {
                    min-height: 200px;
                }

                .results-container {
                    max-height: 200px;
                }

                #representantes-container {
                    padding: 0.5rem;
                }
            }

            .leaflet-interactive {
                transition: fill-opacity 0.2s ease-in-out;
            }

            .result-item {
                animation: fadeIn 0.5s ease-in-out;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* .municipio-tooltip {
                background-color: rgba(0, 0, 0, 0.8);
                color: white;
                border: none;
                border-radius: 4px;
                padding: 4px 8px;
                font-size: 12px;
                font-weight: 500;
            } */

            /* Botão de Reset Zoom */
            .reset-zoom-btn {
                position: absolute;
                bottom: 10px;
                right: 50px;
                z-index: 1000;
                background: white;
                border: 2px solid rgba(0, 0, 0, 0.2);
                border-radius: 4px;
                width: 34px;
                height: 34px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .reset-zoom-btn:hover {
                background: #f4f4f4;
                border-color: rgba(0, 0, 0, 0.4);
            }

            .reset-zoom-btn svg {
                width: 18px;
                height: 18px;
                color: #333;
            }

            /* Botão de Maximizar Mapa */
            .maximize-map-btn {
                position: absolute;
                bottom: 10px;
                right: 10px;
                z-index: 1000;
                background: white;
                border: 2px solid rgba(0, 0, 0, 0.2);
                border-radius: 4px;
                width: 34px;
                height: 34px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .maximize-map-btn:hover {
                background: #f4f4f4;
                border-color: rgba(0, 0, 0, 0.4);
            }

            .maximize-map-btn svg {
                width: 18px;
                height: 18px;
                color: #333;
            }

            /* Estado maximizado */
            .map-maximized .grid-container {
                grid-template-columns: 1fr !important;
            }

            .map-maximized .sidebar {
                display: none !important;
            }

            .map-maximized .map-container {
                grid-column: 1 / -1;
            }

            .map-maximized .map-wrapper {
                min-height: calc(100vh - 100px) !important;
            }

            /* Modo tela cheia real */
            .map-fullscreen {
                overflow: hidden !important;
            }

            .map-fullscreen #representantes-container {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                z-index: 9999 !important;
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                max-width: none !important;
            }

            .map-fullscreen .map-wrapper {
                height: 100vh !important;
                min-height: 100vh !important;
                border-radius: 0 !important;
                padding: 0 !important;
            }

            .map-fullscreen #map {
                height: 100vh !important;
                min-height: 100vh !important;
                border-radius: 0 !important;
            }

            .map-fullscreen .maximize-map-btn {
                position: fixed !important;
                top: 20px !important;
                right: 20px !important;
                z-index: 10000 !important;
            }

            /* Labels dos municípios - Fixos e sempre visíveis */
            /* CSS das labels comentado pois as labels foram removidas
            .municipio-label-fixo {
                background: transparent !important;
                border: none !important;
                border-radius: 0 !important;
                padding: 0 !important;
                font-size: 5px !important;
                font-weight: 600 !important;
                color: #333 !important;
                text-align: center !important;
                white-space: nowrap !important;
                box-shadow: none !important;
                pointer-events: none !important;
                z-index: 1000 !important;
                font-family: 'Inter', sans-serif !important;
                line-height: 1.2 !important;
                max-width: 120px !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                text-shadow: 
                    -1px -1px 0 #ffffff,
                    1px -1px 0 #ffffff,
                    -1px 1px 0 #ffffff,
                    1px 1px 0 #ffffff;
            }
            
            .municipio-label-container {
                background: transparent !important;
                border: none !important;
            }

            /* Ajustar tamanho do texto baseado no zoom */
            .leaflet-zoom-animated .municipio-label-fixo {
                font-size: 7px !important;
            }

            .leaflet-zoom-animated.leaflet-zoom-level-6 .municipio-label-fixo,
            .leaflet-zoom-animated.leaflet-zoom-level-7 .municipio-label-fixo {
                font-size: 8px !important;
            }

            .leaflet-zoom-animated.leaflet-zoom-level-8 .municipio-label-fixo,
            .leaflet-zoom-animated.leaflet-zoom-level-9 .municipio-label-fixo {
                font-size: 9px !important;
            }

            .leaflet-zoom-animated.leaflet-zoom-level-10 .municipio-label-fixo {
                font-size: 10px !important;
            }

            */

            /* Estilos para busca melhorada */
            .search-filter.active {
                background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
                color: #ffffff;
                border-color: #2563eb;
                box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4), 0 2px 4px rgba(37, 99, 235, 0.3);
                font-weight: 500;
            }

            .search-filter.active::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.05) 100%);
                border-radius: inherit;
                pointer-events: none;
            }

            .search-filter.active i,
            .search-filter.active span {
                position: relative;
                z-index: 1;
                color: #ffffff !important;
            }

            .search-filter {
                background-color: #f8fafc;
                color: #64748b;
                border-color: #e2e8f0;
                font-weight: 400;
            }

            .search-filter:hover:not(.active) {
                background-color: #f1f5f9;
                border-color: #cbd5e1;
                color: #475569;
            }

            .search-filter:hover:not(.active) i {
                color: #475569 !important;
            }

            .suggestion-item {
                padding: 8px 12px;
                cursor: pointer;
                border-bottom: 1px solid #f3f4f6;
                transition: background-color 0.2s;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .suggestion-item:hover,
            .suggestion-item.highlighted {
                background-color: #f3f4f6;
            }

            .suggestion-item:last-child {
                border-bottom: none;
            }

            .suggestion-type {
                font-size: 10px;
                background-color: #e5e7eb;
                color: #6b7280;
                padding: 2px 6px;
                border-radius: 10px;
                text-transform: uppercase;
                font-weight: 500;
                margin-left: 8px;
            }

            .recent-search-item {
                background-color: #f3f4f6;
                color: #6b7280;
                padding: 4px 8px;
                border-radius: 12px;
                font-size: 10px;
                cursor: pointer;
                transition: all 0.2s;
            }

            .recent-search-item:hover {
                background-color: #e5e7eb;
                color: #374151;
            }

            #clear-search {
                transition: all 0.2s;
            }

            /* Animações e transições melhoradas */
            #suggestions-container {
                opacity: 0;
                transform: translateY(-10px);
                transition: all 0.2s ease-out;
            }

            #suggestions-container:not(.hidden) {
                opacity: 1;
                transform: translateY(0);
            }

            .search-filter {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                transform: scale(1);
                position: relative;
                overflow: hidden;
            }

            .search-filter:hover {
                transform: scale(1.02) translateY(-1px);
            }

            .search-filter.active {
                transform: scale(1.02) translateY(-1px);
            }

            .search-filter:active {
                transform: scale(0.98) translateY(0px);
            }

            .recent-search-item {
                transition: all 0.2s ease-out;
                transform: scale(1);
            }

            .recent-search-item:hover {
                transform: scale(1.05);
            }

            /* Indicador de loading no input */
            .search-loading::after {
                content: '';
                position: absolute;
                right: 30px;
                top: 50%;
                transform: translateY(-50%);
                width: 16px;
                height: 16px;
                border: 2px solid #f3f4f6;
                border-top: 2px solid #3b82f6;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: translateY(-50%) rotate(0deg);
                }

                100% {
                    transform: translateY(-50%) rotate(360deg);
                }
            }

            /* Estados do input */
            #search-input:focus {
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            }

            #search-input.has-results {
                border-color: #10b981;
            }

            #search-input.no-results {
                border-color: #ef4444;
            }

            #search-input.has-suggestions {
                border-color: #3b82f6;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            }

            #search-input.has-suggestions::placeholder {
                color: #3b82f6;
                opacity: 0.7;
            }

            /* Estilos para telefones nos cards */
            .phone-pill {
                display: inline-flex;
                align-items: center;
                background-color: #eff6ff;
                color: #2563eb;
                padding: 4px 8px;
                border-radius: 9999px;
                font-size: 0.75rem;
                text-decoration: none;
                transition: all 0.2s ease;
                border: 1px solid transparent;
            }

            .phone-pill:hover {
                background-color: #dbeafe;
                border-color: #93c5fd;
                text-decoration: none;
                transform: translateY(-1px);
                box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            }

            .phone-expand-btn {
                background-color: #f3f4f6;
                color: #6b7280;
                border: 1px solid #d1d5db;
                transition: all 0.2s ease;
            }

            .phone-expand-btn:hover {
                background-color: #e5e7eb;
                border-color: #9ca3af;
                transform: translateY(-1px);
            }

            /* Estilos para bairros de São Paulo */
            .bairro-with-rep {
                filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 6px rgba(255, 255, 255, 0.6));
            }

            .bairro-without-rep {
                filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.7)) drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
            }

            /* Alternativa usando outline para SVG paths */
            .leaflet-interactive.bairro-with-rep {
                stroke-dasharray: 1, 10 !important;
                stroke: #ffffff !important;
                stroke-width: 3px !important;
                /* filter: drop-shadow(0 0 10px white); */
            }

            .leaflet-interactive.bairro-without-rep {
                stroke: #DC2626 !important;
                /* vermelho */
                stroke-width: 1px !important;
                /* traço principal */
                stroke-dasharray: 1, 3 !important;
                /* tracejado */
                opacity: 0.6 !important;

                /* truque da borda */
                paint-order: stroke;
                filter: drop-shadow(0 0 1px white);
            }
        </style>

    </head>

    <body class="bg-white">

        <div id="representantes-container" class="container mx-auto p-2 sm:p-4 lg:p-6 max-w-7xl">

            <div class="mb-4 lg:mb-6">
                <h1 id="main-title" class="text-xl sm:text-2xl lg:text-3xl font-bold text-gray-800">Escolha sua região para
                    encontrar
                    representantes</h1>
                <button id="back-to-brazil" class="hidden text-blue-600 font-semibold mt-2 hover:underline">&lt; VOLTAR PARA
                    O MAPA DO BRASIL</button>
            </div>

            <div class="main-content">
                <div class="grid-container">

                    <!-- Coluna do Mapa -->
                    <div class="map-container">
                        <div class="map-wrapper">
                            <div id="map"></div>
                            <button id="reset-zoom-btn" class="reset-zoom-btn" title="Resetar zoom">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                                </svg>
                            </button>

                            <button id="maximize-map-btn" class="maximize-map-btn" title="Maximizar mapa">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Coluna de Busca e Resultados -->
                    <div class="sidebar">
                        <div class="sidebar-content">
                            <h2 class="text-lg sm:text-xl font-bold text-gray-800 mb-4">SEUS REPRESENTANTES</h2>

                            <div class="mb-4 relative">
                                <!-- Campo de busca principal -->
                                <div class="relative">
                                    <input type="text" id="search-input"
                                        placeholder="Busque por estado, cidade ou bairro (SP)..."
                                        class="w-full px-10 py-2 sm:px-12 sm:py-3 border border-gray-300 rounded-lg outline-none transition text-sm sm:text-base focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                                        autocomplete="off">
                                    <!-- Ícone de busca -->
                                    <i data-lucide="search"
                                        class="absolute left-3 top-1/2 transform -translate-y-1/2 h-4 w-4 text-gray-400"></i>

                                    <!-- Botão para limpar busca -->
                                    <button id="clear-search"
                                        class="absolute right-3 top-1/2 transform -translate-y-1/2 h-4 w-4 text-gray-400 hover:text-gray-600 hidden">
                                        <i data-lucide="x" class="h-4 w-4"></i>
                                    </button>
                                </div>

                                <!-- Dropdown de sugestões -->
                                <div id="suggestions-container"
                                    class="absolute top-full left-0 right-0 z-50 bg-white border border-gray-200 rounded-lg shadow-lg mt-1 max-h-64 overflow-y-auto hidden">
                                    <div id="suggestions-list"></div>
                                </div>

                                <!-- Filtros rápidos -->
                                <div class="flex flex-wrap gap-2 mt-3" style="display: none;">
                                    <button
                                        class="search-filter active px-3 py-1 text-xs rounded-full border transition flex items-center gap-1"
                                        data-filter="all">
                                        <i data-lucide="globe" class="h-3 w-3"></i>
                                        Todos
                                    </button>
                                    <button
                                        class="search-filter px-3 py-1 text-xs rounded-full border transition flex items-center gap-1"
                                        data-filter="estados">
                                        <i data-lucide="map" class="h-3 w-3"></i>
                                        Estados
                                    </button>
                                    <button
                                        class="search-filter px-3 py-1 text-xs rounded-full border transition flex items-center gap-1"
                                        data-filter="cidades">
                                        <i data-lucide="map-pin" class="h-3 w-3"></i>
                                        Cidades
                                    </button>
                                    <button
                                        class="search-filter px-3 py-1 text-xs rounded-full border transition flex items-center gap-1"
                                        data-filter="bairros">
                                        <i data-lucide="home" class="h-3 w-3"></i>
                                        Bairros (SP)
                                    </button>
                                    <button
                                        class="search-filter px-3 py-1 text-xs rounded-full border transition flex items-center gap-1"
                                        data-filter="representantes">
                                        <i data-lucide="users" class="h-3 w-3"></i>
                                        Representantes
                                    </button>
                                </div>

                                <!-- Histórico de buscas recentes -->
                                <div id="recent-searches" class="mt-3 hidden" style="display: none;">
                                    <h4 class="text-xs font-medium text-gray-600 mb-2 flex items-center gap-1">
                                        <i data-lucide="clock" class="h-3 w-3"></i>
                                        Buscas recentes:
                                    </h4>
                                    <div id="recent-searches-list" class="flex flex-wrap gap-1"></div>
                                </div>
                            </div>

                            <div id="results-container" class="results-container space-y-3 pr-2">
                                <div id="initial-message" class="text-center py-16">
                                    <div id="loading-indicator">
                                        <svg class="animate-spin mx-auto h-12 w-12 text-blue-600"
                                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                                stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor"
                                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                            </path>
                                        </svg>
                                        <p class="mt-4 text-sm text-gray-500">Carregando dados...</p>
                                    </div>
                                    <div id="default-message" class="hidden">
                                        <svg class="mx-auto h-12 w-12 text-gray-400" xmlns="http://www.w3.org/2000/svg"
                                            fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m5.231 13.481L15 17.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Zm3.75 11.625a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                                        </svg>
                                        <p class="mt-4 text-sm text-gray-500">Use a busca ou clique em um estado no mapa.
                                        </p>
                                    </div>

                    // --- FUNÇÕES UTILITÁRIAS GLOBAIS ---

                    // Função global para busca rigorosa - evita falsos positivos
                    function strictSearch(query, target, options = {}) {
                        const {
                            minLength = 4,           // Comprimento mínimo para busca parcial
                            useStartsWith = true,     // Usar startsWith em vez de includes
                            maxSimilarity = 0.9,     // Threshold máximo para similaridade
                            maxLengthDiff = 2        // Diferença máxima de comprimento
                        } = options;

                        const normalizedQuery = normalize(query);
                        const normalizedTarget = normalize(target);

                        // 1. Match exato (prioridade máxima)
                        if (normalizedQuery === normalizedTarget) {
                            return { match: true, type: 'exact', score: 100 };
                        }

                        // 2. Match parcial (prioridade média) - apenas se usar startsWith
                        if (useStartsWith && normalizedQuery.length >= minLength && normalizedTarget.startsWith(normalizedQuery)) {
                            return { match: true, type: 'partial', score: 80 };
                        }

                        // 3. Match por similaridade (prioridade baixa) - muito restritivo
                        if (maxSimilarity > 0) {
                            const similarity = calculateSimilarity(normalizedTarget, normalizedQuery);
                            if (similarity > maxSimilarity) {
                                // Verificações adicionais para evitar falsos positivos
                                const lengthDiff = Math.abs(normalizedTarget.length - normalizedQuery.length);
                                const noSubstringMatch = !normalizedTarget.includes(normalizedQuery) && !normalizedQuery.includes(normalizedTarget);

                                if (lengthDiff <= maxLengthDiff && noSubstringMatch) {
                                    return { match: true, type: 'similar', score: Math.round(similarity * 100) };
                                }
                            }
                        }

                        return { match: false, type: 'none', score: 0 };
                    }

                    // --- FUNÇÕES DE BUSCA MELHORADAS ---

                    // Função para calcular similaridade entre strings (Levenshtein distance)
                    function calculateSimilarity(str1, str2) {
                        const longer = str1.length > str2.length ? str1 : str2;
                        const shorter = str1.length > str2.length ? str2 : str1;

                        if (longer.length === 0) return 1.0;

                        const distance = levenshteinDistance(longer, shorter);
                        return (longer.length - distance) / longer.length;
                    }

                    // Implementação do algoritmo de Levenshtein
                    function levenshteinDistance(str1, str2) {
                        const matrix = [];

                        for (let i = 0; i <= str2.length; i++) {
                            matrix[i] = [i];
                        }

                        for (let j = 0; j <= str1.length; j++) {
                            matrix[0][j] = j;
                        }

                        for (let i = 1; i <= str2.length; i++) {
                            for (let j = 1; j <= str1.length; j++) {
                                if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                                    matrix[i][j] = matrix[i - 1][j - 1];
                                } else {
                                    matrix[i][j] = Math.min(
                                        matrix[i - 1][j - 1] + 1,
                                        matrix[i][j - 1] + 1,
                                        matrix[i - 1][j] + 1
                                    );
                                }
                            }
                        }

                        return matrix[str2.length][str1.length];
                    }

                    // Função para determinar o tipo de busca
                    function determineSearchType(query) {
                        const normalizedQuery = normalize(query);

                        // 1. Verificar se é busca por estado (sigla ou nome completo)
                        const statePatterns = [
                            /^(sp|rj|mg|ba|pr|rs|pe|ce|pa|sc|go|ma|pb|am|es|mt|al|pi|df|ms|se|rn|ro|ac|ap|rr|to)$/i,
                            /^(são paulo|rio de janeiro|minas gerais|bahia|paraná|rio grande do sul|pernambuco|ceará|pará|santa catarina|goiás|maranhão|paraíba|amazonas|espírito santo|mato grosso|alagoas|piauí|distrito federal|mato grosso do sul|sergipe|rio grande do norte|rondônia|acre|amapá|roraima|tocantins)$/i
                        ];

                        for (const pattern of statePatterns) {
                            if (pattern.test(normalizedQuery)) {
                                return { type: 'estado', query: normalizedQuery };
                            }
                        }

                        // 2. Verificar se é busca por bairro de São Paulo baseado no conjunto real
                        if (knownBairrosSP.size > 0) {
                            if (knownBairrosSP.has(normalizedQuery)) {
                                return { type: 'bairro', query: normalizedQuery };
                            }
                            if (normalizedQuery.length >= 3) {
                                for (const b of knownBairrosSP) {
                                    if (b.startsWith(normalizedQuery)) {
                                        return { type: 'bairro', query: normalizedQuery };
                                    }
                                }
                            }
                        }

                        // 3. Verificar se é busca por cidade específica
                        return { type: 'cidade', query: normalizedQuery };
                    }

                    // Função para detectar o contexto da busca (estado, cidade, bairro, representante)
                    function detectSearchContext(query) {
                        // Mapeamento de estados
                        const stateMap = {
                            'sao paulo': 'SP', 'sp': 'SP',
                            'rio de janeiro': 'RJ', 'rj': 'RJ',
                            'minas gerais': 'MG', 'mg': 'MG',
                            'bahia': 'BA', 'ba': 'BA',
                            'parana': 'PR', 'pr': 'PR',
                            'rio grande do sul': 'RS', 'rs': 'RS',
                            'pernambuco': 'PE', 'pe': 'PE',
                            'ceara': 'CE', 'ce': 'CE',
                            'goias': 'GO', 'go': 'GO',
                            'para': 'PA', 'pa': 'PA',
                            'maranhao': 'MA', 'ma': 'MA',
                            'santa catarina': 'SC', 'sc': 'SC',
                            'espirito santo': 'ES', 'es': 'ES',
                            'paraiba': 'PB', 'pb': 'PB',
                            'piaui': 'PI', 'pi': 'PI',
                            'amazonas': 'AM', 'am': 'AM',
                            'acre': 'AC', 'ac': 'AC',
                            'rondonia': 'RO', 'ro': 'RO',
                            'roraima': 'RR', 'rr': 'RR',
                            'amapa': 'AP', 'ap': 'AP',
                            'tocantins': 'TO', 'to': 'TO',
                            'mato grosso': 'MT', 'mt': 'MT',
                            'mato grosso do sul': 'MS', 'ms': 'MS',
                            'alagoas': 'AL', 'al': 'AL',
                            'sergipe': 'SE', 'se': 'SE',
                            'distrito federal': 'DF', 'df': 'DF'
                        };

                        // Padrões para detectar diferentes tipos de busca
                        const patterns = {
                            // "Cidade, Estado" ou "Cidade - Estado"
                            cidade_estado: /^(.+?)\s*[,-\s]\s*(.+)$/,
                            // "Bairro, SP" ou "Bairro - SP" (específico para São Paulo)
                            bairro_estado: /^(.+?)\s*[,-\s]\s*(sp|sao paulo)$/i,
                            // "Representante em Estado" ou "Representante em Cidade"
                            representante_local: /^(.+?)\s+(em|de|no|na)\s+(.+)$/i
                        };

                        // 1. Verificar se é busca por estado puro
                        if (stateMap[query]) {
                            return { type: 'estado', estado: stateMap[query] };
                        }

                        // 2. Verificar padrões combinados
                        for (const [patternName, pattern] of Object.entries(patterns)) {
                            const match = query.match(pattern);
                            if (match) {
                                switch (patternName) {
                                    case 'cidade_estado':
                                        const cidade = match[1].trim();
                                        const estado = stateMap[match[2].trim().toLowerCase()];
                                        if (estado) {
                                            return { type: 'cidade_estado', cidade, estado };
                                        }
                                        break;
                                    case 'bairro_estado':
                                        const bairro = match[1].trim();
                                        return { type: 'bairro_estado', bairro, estado: 'SP' };
                                    case 'representante_local':
                                        const representante = match[1].trim();
                                        const local = match[3].trim();
                                        const estadoLocal = stateMap[local.toLowerCase()];
                                        if (estadoLocal) {
                                            return { type: 'representante', representante, estado: estadoLocal };
                                        }
                                        // Se não é estado, pode ser cidade
                                        return { type: 'representante', representante, cidade: local };
                                }
                            }
                        }

                        // 3. Verificar se é um bairro de São Paulo (busca em lista conhecida)
                        if (isBairroSP(query)) {
                            return { type: 'bairro', bairro: query, estado: 'SP' };
                        }

                        // 4. Verificar se é uma cidade conhecida
                        const cidadeInfo = findCidadeInfo(query);
                        if (cidadeInfo) {
                            return { type: 'cidade', cidade: query, estado: cidadeInfo.estado };
                        }

                        // 5. Verificar se é um representante conhecido
                        if (isRepresentanteConhecido(query)) {
                            return { type: 'representante', representante: query };
                        }

                        // 6. Busca geral
                        return { type: 'general', query };
                    }

                    // Nova função de busca hierárquica que respeita Estado > Cidade > Representante > Bairro (SP)
                    function searchRepresentatives(query) {
                        if (!query) return [];

                        const normalizedQuery = normalize(query);

                        // 1. Detectar o tipo de busca e contexto
                        const searchContext = detectSearchContext(normalizedQuery);

                        // 2. Executar busca baseada no contexto detectado
                        switch (searchContext.type) {
                            case 'estado':
                                return searchByEstado(searchContext.estado);
                            case 'cidade':
                                return searchByCidade(searchContext.cidade, searchContext.estado);
                            case 'bairro':
                                return searchByBairro(searchContext.bairro, searchContext.estado);
                            case 'representante':
                                return searchByRepresentante(searchContext.representante, searchContext.estado, searchContext.cidade);
                            case 'cidade_estado':
                                return searchByCidade(searchContext.cidade, searchContext.estado);
                            case 'bairro_estado':
                                return searchByBairro(searchContext.bairro, searchContext.estado);
                            default:
                                // Busca geral que tenta todos os tipos
                                return searchGeneral(normalizedQuery);
                        }
                    }

                    // Funções de busca específicas por tipo
                    function searchByEstado(estado) {
                        const foundIds = new Set();

                        Object.values(representativesData).forEach(rep => {
                            if (rep.estados && rep.estados[estado]) {
                                foundIds.add(rep.id);
                            }
                        });

                        return representativesData.filter(rep => foundIds.has(rep.id));
                    }

                    function searchByCidade(cidade, estado = null) {
                        const foundIds = new Set();
                        const normalizedCidade = normalize(cidade);

                        Object.values(representativesData).forEach(rep => {
                            if (rep.estados) {
                                // Se estado foi especificado, buscar apenas nesse estado
                                if (estado && rep.estados[estado]) {
                                    const cidades = rep.estados[estado].cidades || [];
                                    if (cidades.some(c => {
                                        const normalizedC = normalize(c);
                                        // Busca exata primeiro
                                        if (normalizedC === normalizedCidade) {
                                            return true;
                                        }
                                        // Se não encontrou exato, verificar se é uma correspondência parcial válida
                                        // Apenas se a cidade pesquisada for menor que a cidade da lista E começar com a query
                                        if (normalizedCidade.length < normalizedC.length && normalizedC.startsWith(normalizedCidade)) {
                                            // Verificar se não é apenas uma coincidência de caracteres
                                            // A cidade pesquisada deve ser pelo menos 4 caracteres para evitar falsos positivos
                                            return normalizedCidade.length >= 4;
                                        }
                                        return false;
                                    })) {
                                        foundIds.add(rep.id);
                                    }
                                } else {
                                    // Buscar em todos os estados
                                    Object.entries(rep.estados).forEach(([estadoSigla, estadoData]) => {
                                        const cidades = estadoData.cidades || [];
                                        if (cidades.some(c => {
                                            const normalizedC = normalize(c);
                                            // Busca exata primeiro
                                            if (normalizedC === normalizedCidade) {
                                                return true;
                                            }
                                            // Se não encontrou exato, verificar se é uma correspondência parcial válida
                                            if (normalizedCidade.length < normalizedC.length && normalizedC.startsWith(normalizedCidade)) {
                                                return normalizedCidade.length >= 4;
                                            }
                                            return false;
                                        })) {
                                            foundIds.add(rep.id);
                                        }
                                    });
                                }
                            }
                        });

                        return representativesData.filter(rep => foundIds.has(rep.id));
                    }

                    function searchByBairro(bairro, estado = 'SP') {
                        const foundIds = new Set();
                        const normalizedBairro = normalize(bairro);

                        Object.values(representativesData).forEach(rep => {
                            if (rep.estados && rep.estados[estado]) {
                                const bairros = rep.estados[estado].bairros || [];
                                if (bairros.some(b => {
                                    const normalizedB = normalize(b);
                                    // Busca exata primeiro
                                    if (normalizedB === normalizedBairro) {
                                        return true;
                                    }
                                    // Se não encontrou exato, verificar se é uma correspondência parcial válida
                                    // Apenas se o bairro pesquisado for menor que o bairro da lista E começar com a query
                                    if (normalizedBairro.length < normalizedB.length && normalizedB.startsWith(normalizedBairro)) {
                                        // Verificar se não é apenas uma coincidência de caracteres
                                        // O bairro pesquisado deve ser pelo menos 4 caracteres para evitar falsos positivos
                                        return normalizedBairro.length >= 4;
                                    }
                                    return false;
                                })) {
                                    foundIds.add(rep.id);
                                }
                            }
                        });

                        return representativesData.filter(rep => foundIds.has(rep.id));
                    }

                    function searchByRepresentante(representante, estado = null, cidade = null) {
                        const foundIds = new Set();
                        const normalizedRepresentante = normalize(representante);

                        Object.values(representativesData).forEach(rep => {
                            const repName = normalize(rep.nome);

                            // Verificar se o nome do representante corresponde - mais rigoroso
                            if (repName.startsWith(normalizedRepresentante) || repName === normalizedRepresentante) {
                                // Se estado foi especificado, verificar se atende esse estado
                                if (estado && (!rep.estados || !rep.estados[estado])) {
                                    return; // Não atende o estado especificado
                                }

                                // Se cidade foi especificada, verificar se atende essa cidade
                                if (cidade && estado && rep.estados && rep.estados[estado]) {
                                    const cidades = rep.estados[estado].cidades || [];
                                    const normalizedCidade = normalize(cidade);
                                    if (!cidades.some(c => {
                                        const normalizedC = normalize(c);
                                        // Busca exata primeiro
                                        if (normalizedC === normalizedCidade) {
                                            return true;
                                        }
                                        // Se não encontrou exato, verificar se é uma correspondência parcial válida
                                        // Apenas se a cidade pesquisada for menor que a cidade da lista E começar com a query
                                        if (normalizedCidade.length < normalizedC.length && normalizedC.startsWith(normalizedCidade)) {
                                            // Verificar se não é apenas uma coincidência de caracteres
                                            // A cidade pesquisada deve ser pelo menos 4 caracteres para evitar falsos positivos
                                            return normalizedCidade.length >= 4;
                                        }
                                        return false;
                                    })) {
                                        return; // Não atende a cidade especificada
                                    }
                                }

                                foundIds.add(rep.id);
                            }
                        });

                        return representativesData.filter(rep => foundIds.has(rep.id));
                    }

                    function searchGeneral(query) {
                        const foundIds = new Set();

                        // Tentar buscar por estado
                        const estadoResults = searchByEstado(query);
                        estadoResults.forEach(rep => foundIds.add(rep.id));

                        // Tentar buscar por cidade
                        const cidadeResults = searchByCidade(query);

                        const bairroResults = searchByBairro(query);

                        const representanteResults = searchByRepresentante(query);

                    function findCidadeInfo(query) {
                        // Buscar cidade em todos os representantes para determinar o estado - mais rigoroso
                        const normalizedQuery = normalize(query);

                        // Primeiro, tentar match exato
                        for (const rep of Object.values(representativesData)) {
                            if (rep.estados) {
                                for (const [estado, estadoData] of Object.entries(rep.estados)) {
                                    const cidades = estadoData.cidades || [];
                                    if (cidades.some(c => normalize(c) === normalizedQuery)) {
                                        return { estado, cidade: query };
                                    }
                                }
                            }
                        }

                        // Se não encontrou match exato, tentar match que comece com a query (mais rigoroso)
                        if (normalizedQuery.length >= 4) {
                            for (const rep of Object.values(representativesData)) {
                                if (rep.estados) {
                                    for (const [estado, estadoData] of Object.entries(rep.estados)) {
                                        const cidades = estadoData.cidades || [];
                                        if (cidades.some(c => {
                                            const normalizedC = normalize(c);
                                            return normalizedC.startsWith(normalizedQuery);
                                        })) {
                                            return { estado, cidade: query };
                                        }

                        return null;

                    function isRepresentanteConhecido(query) {
                        // Verificar se é um nome de representante conhecido - mais rigoroso
                        const normalizedQuery = normalize(query);
                        return Object.values(representativesData).some(rep => {
                            const normalizedNome = normalize(rep.nome);
                            // Busca exata ou que comece com a query (mais rigoroso)
                            return normalizedNome === normalizedQuery || normalizedNome.startsWith(normalizedQuery);
                        });
                    }

                    // Função auxiliar para busca por critério único
                    function searchSingleCriterion(query) {
                        const searchType = determineSearchType(query);
                        const normalizedQuery = searchType.query;
                        const foundRepresentativeIds = new Set();

                        switch (searchType.type) {
                            case 'estado':
                                // Busca por estado - ESTRITA por sigla ou nome do estado
                                (function () {
                                    const stateToAbbrev = {
                                        'sao paulo': 'SP', 'rio de janeiro': 'RJ', 'minas gerais': 'MG', 'bahia': 'BA',
                                        'parana': 'PR', 'rio grande do sul': 'RS', 'pernambuco': 'PE', 'ceara': 'CE',
                                        'para': 'PA', 'santa catarina': 'SC', 'goias': 'GO', 'maranhao': 'MA',
                                        'paraiba': 'PB', 'amazonas': 'AM', 'espirito santo': 'ES', 'mato grosso': 'MT',
                                        'alagoas': 'AL', 'piaui': 'PI', 'distrito federal': 'DF', 'mato grosso do sul': 'MS',
                                        'sergipe': 'SE', 'rio grande do norte': 'RN', 'rondonia': 'RO', 'acre': 'AC',
                                        'amapa': 'AP', 'roraima': 'RR', 'tocantins': 'TO'
                                    };
                                    // Determinar código alvo (sigla) a partir da query
                                    let targetCode = null;
                                    if (normalizedQuery.length === 2) {
                                        targetCode = normalizedQuery.toUpperCase();
                                    } else if (stateToAbbrev[normalizedQuery]) {
                                        targetCode = stateToAbbrev[normalizedQuery];
                                    }

                                    // Fallback: se não reconhecido, não retorna nada
                                    if (!targetCode) return;

                                    // Filtrar diretamente em representativesData para evitar poluição por chaves genéricas
                                    representativesData.forEach(rep => {
                                        let atendeEstado = false;
                                        if (rep.EstadosDetalhados) {
                                            // Match por chave igual à sigla (ex: 'PA')
                                            if (rep.EstadosDetalhados[targetCode]) {
                                                atendeEstado = true;
                                            } else {
                                                // Ou nome do estado como chave (casos antigos) normalizado
                                                atendeEstado = Object.keys(rep.EstadosDetalhados).some(estadoKey => {
                                                    const nk = normalize(estadoKey);
                                                    return nk === normalizedQuery;
                                                });
                                            }
                                        }
                                        // Estrutura antiga
                                        if (!atendeEstado && rep.SiglaEstado) {
                                            atendeEstado = normalize(rep.SiglaEstado) === normalize(targetCode) ||
                                                normalize(rep.Estado) === normalizedQuery;
                                        }
                                        if (atendeEstado) {
                                            foundRepresentativeIds.add(rep.id);

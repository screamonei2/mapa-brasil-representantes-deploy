<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Rio de Janeiro</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .debug-item { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        .error { background: #ffebee; border-left: 4px solid #f44336; }
        .success { background: #e8f5e8; border-left: 4px solid #4caf50; }
        .warning { background: #fff3e0; border-left: 4px solid #ff9800; }
    </style>
</head>
<body>
    <h1>Debug: Problema com Rio de Janeiro</h1>
    
    <div class="debug-section">
        <h2>1. Carregando dados dos representantes</h2>
        <div id="loading-status" class="debug-item">Carregando...</div>
    </div>
    
    <div class="debug-section">
        <h2>2. Verificando mapeamento Rio de Janeiro</h2>
        <div id="mapping-status" class="debug-item">Aguardando dados...</div>
    </div>
    
    <div class="debug-section">
        <h2>3. Testando busca por cidade</h2>
        <div id="search-test" class="debug-item">Aguardando dados...</div>
    </div>
    
    <div class="debug-section">
        <h2>4. Logs detalhados</h2>
        <div id="logs" class="debug-item" style="max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px;"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `debug-item ${type}`;
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(message);
        }

        async function debugRioDeJaneiro() {
            try {
                log('🚀 Iniciando debug do Rio de Janeiro...', 'success');
                
                // 1. Carregar dados dos representantes
                log('📥 Carregando dados dos representantes...');
                const response = await fetch('./data/representantes_por_estado.json');
                const rawData = await response.json();
                
                document.getElementById('loading-status').innerHTML = `
                    <div class="success">
                        ✅ Dados carregados com sucesso<br>
                        📊 Total de representantes: ${Object.keys(rawData.representantes || rawData).length}
                    </div>
                `;
                
                // 2. Verificar estrutura dos dados
                log('🔍 Analisando estrutura dos dados...');
                const representantes = rawData.representantes || rawData;
                
                // Procurar por representantes que atendem RJ
                const representantesRJ = [];
                for (const [nomeEmpresa, dadosEmpresa] of Object.entries(representantes)) {
                    if (dadosEmpresa.estados && dadosEmpresa.estados.RJ) {
                        representantesRJ.push({
                            nome: dadosEmpresa.nome || nomeEmpresa,
                            cidades: dadosEmpresa.estados.RJ.cidades || [],
                            codigo: dadosEmpresa.codigo
                        });
                    }
                }
                
                log(`📋 Encontrados ${representantesRJ.length} representantes para RJ:`, 'success');
                representantesRJ.forEach(rep => {
                    log(`   • ${rep.nome} (${rep.codigo}): ${rep.cidades.join(', ')}`);
                });
                
                // 3. Verificar se Rio de Janeiro está nas cidades
                const temRioDeJaneiro = representantesRJ.some(rep => 
                    rep.cidades.some(cidade => 
                        cidade.toLowerCase().includes('rio de janeiro')
                    )
                );
                
                if (temRioDeJaneiro) {
                    log('✅ Rio de Janeiro encontrado nos dados dos representantes', 'success');
                } else {
                    log('❌ Rio de Janeiro NÃO encontrado nos dados dos representantes', 'error');
                }
                
                // 4. Simular a função transformRepresentativesData
                log('🔄 Simulando transformRepresentativesData...');
                const municipioRepresentativeMap = new Map();
                
                for (const [nomeEmpresa, dadosEmpresa] of Object.entries(representantes)) {
                    if (dadosEmpresa.estados && dadosEmpresa.estados.RJ) {
                        const cidades = dadosEmpresa.estados.RJ.cidades || [];
                        cidades.forEach(cidade => {
                            const normalizedCidade = normalize(cidade);
                            const cidadeEstadoKey = `${normalizedCidade}-rj`;
                            
                            if (!municipioRepresentativeMap.has(cidadeEstadoKey)) {
                                municipioRepresentativeMap.set(cidadeEstadoKey, []);
                            }
                            
                            municipioRepresentativeMap.get(cidadeEstadoKey).push({
                                id: `${nomeEmpresa}_${dadosEmpresa.codigo}`,
                                NomeRepresentante: dadosEmpresa.nome || nomeEmpresa,
                                CodigoRepresentante: dadosEmpresa.codigo
                            });
                        });
                    }
                }
                
                log(`📊 Total de mapeamentos criados: ${municipioRepresentativeMap.size}`);
                
                // 5. Testar busca por Rio de Janeiro
                const normalizedRio = normalize('Rio de Janeiro');
                const cidadeEstadoKey = `${normalizedRio}-rj`;
                const representantesRio = municipioRepresentativeMap.get(cidadeEstadoKey) || [];
                
                log(`🔍 Testando busca por: "${cidadeEstadoKey}"`);
                log(`📋 Representantes encontrados: ${representantesRio.length}`);
                
                if (representantesRio.length > 0) {
                    representantesRio.forEach(rep => {
                        log(`   ✅ ${rep.NomeRepresentante} (${rep.CodigoRepresentante})`, 'success');
                    });
                    document.getElementById('search-test').innerHTML = `
                        <div class="success">
                            ✅ Busca funcionando! Encontrados ${representantesRio.length} representantes para Rio de Janeiro
                        </div>
                    `;
                } else {
                    log('❌ Nenhum representante encontrado para Rio de Janeiro', 'error');
                    document.getElementById('search-test').innerHTML = `
                        <div class="error">
                            ❌ Problema na busca! Nenhum representante encontrado para Rio de Janeiro
                        </div>
                    `;
                }
                
                // 6. Verificar todas as chaves do mapa
                log('🔑 Verificando todas as chaves do municipioRepresentativeMap...');
                const todasChaves = Array.from(municipioRepresentativeMap.keys());
                const chavesRJ = todasChaves.filter(key => key.includes('-rj'));
                
                log(`📊 Total de chaves: ${todasChaves.length}`);
                log(`📊 Chaves RJ: ${chavesRJ.length}`);
                log(`📋 Primeiras 10 chaves RJ: ${chavesRJ.slice(0, 10).join(', ')}`);
                
                // 7. Verificar se há problema com normalização
                log('🔍 Verificando normalização...');
                const testCases = [
                    'Rio de Janeiro',
                    'RIO DE JANEIRO',
                    'rio de janeiro',
                    'Rio de Janeiro ',
                    ' Rio de Janeiro'
                ];
                
                testCases.forEach(testCase => {
                    const normalized = normalize(testCase);
                    const key = `${normalized}-rj`;
                    const found = municipioRepresentativeMap.get(key);
                    log(`   "${testCase}" -> "${normalized}" -> "${key}" -> ${found ? '✅' : '❌'}`);
                });
                
                document.getElementById('mapping-status').innerHTML = `
                    <div class="${representantesRio.length > 0 ? 'success' : 'error'}">
                        ${representantesRio.length > 0 ? '✅' : '❌'} Mapeamento: ${representantesRio.length} representantes encontrados<br>
                        Chave testada: "${cidadeEstadoKey}"<br>
                        Total de chaves RJ: ${chavesRJ.length}
                    </div>
                `;
                
            } catch (error) {
                log(`❌ Erro durante debug: ${error.message}`, 'error');
                document.getElementById('loading-status').innerHTML = `
                    <div class="error">
                        ❌ Erro ao carregar dados: ${error.message}
                    </div>
                `;
            }
        }
        
        function normalize(str) {
            return (str || "")
                .toString()
                .normalize("NFD")
                .replace(/[̀-ͯ]/g, "")
                .replace(/[^\w\s]/gi, "")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();
        }
        
        // Executar debug quando a página carregar
        document.addEventListener('DOMContentLoaded', debugRioDeJaneiro);
    </script>
</body>
</html>

                    function updateLegend(stateRepresentatives = []) {
                        const legendElement = document.getElementById('legend');
                        const legendItemsElement = document.getElementById('legend-items');

                        if (!legendElement || !legendItemsElement) return;

                        // Limpar itens existentes
                        legendItemsElement.innerHTML = '';

                        if (stateRepresentatives.length === 0) {
                            legendElement.classList.add('hidden');
                            return;
                        }

                        // CRÍTICO: Mostrar apenas representantes do estado atualmente selecionado
                        // Filtrar representantes para mostrar apenas os do estado atual
                        let filteredRepresentatives = stateRepresentatives;
                        if (viewMode === 'municipios' && currentState && currentState.code) {
                            filteredRepresentatives = stateRepresentatives.filter(rep => {
                                // Verificar se o representante atende o estado atual
                                if (rep.EstadosDetalhados) {
                                    return Object.keys(rep.EstadosDetalhados).some(estado =>
                                        normalize(estado) === normalize(currentState.code) ||
                                        normalize(estado) === normalize(currentState.name)
                                    );
                                } else {
                                    // Estrutura antiga: verificar SiglaEstado
                                    return normalize(rep.SiglaEstado) === normalize(currentState.code) ||
                                        normalize(rep.Estado) === normalize(currentState.name);
                                }
                            });
                        }

                        if (filteredRepresentatives.length === 0) {
                            legendElement.classList.add('hidden');
                            return;
                        }

                        // Criar itens da legenda
                        filteredRepresentatives.forEach(rep => {
                            const color = representativeColorMap.get(rep.id) || '#3b82f6';
                            const legendItem = document.createElement('div');
                            legendItem.className = 'flex items-center text-xs text-gray-700';
                            legendItem.innerHTML = `
                            <div class="w-3 h-3 rounded-full mr-2" style="background-color: ${color};"></div>
                            <span class="truncate" title="${rep.NomeRepresentante}">${rep.NomeRepresentante}</span>
                        `;
                            legendItemsElement.appendChild(legendItem);
                        });

                        legendElement.classList.remove('hidden');
                    }

                    // --- FUNÇÕES DO MAPA DE ESTADOS ---

                    function getStateCode(properties) {
                        // Baseado na estrutura real do uf.json
                        // Priorizar UF_05 que contém a sigla do estado (ex: "CE", "AC", "BA")
                        return properties.UF_05 || properties.uf || properties.sigla ||
                            properties.SIGLA || properties.UF ||
                            // Fallback para nome completo se não encontrar sigla
                            properties.NOME_UF || properties.nome || properties.NOME ||
                            properties.name || properties.NAME;
                    }

                    function onEachStateFeature(feature, layer) {
                        layer.on({
                            mouseover: e => {
                                if (e.target !== selectedStateLayer && viewMode === 'states') {
                                    e.target.setStyle(highlightMapStyle);
                                }
                            },
                            mouseout: e => {
                                if (e.target !== selectedStateLayer && viewMode === 'states') {
                                    geoJsonLayer.resetStyle(e.target);
                                }
                            }
                            // Removemos o click handler - será tratado pelo listener global
                        });
                    }

                    // Função para garantir que estados não selecionados mantenham cor azul
                    function ensureNonSelectedStatesStayBlue() {
                        if (viewMode === 'municipios' && currentState && currentState.code) {
                            // Resetar todos os estados não selecionados para azul
                            geoJsonLayer.eachLayer(layer => {
                                if (layer !== selectedStateLayer) {
                                    layer.setStyle(defaultMapStyle);
                                }
                            });

                            // Garantir que municípios de outros estados fiquem azuis
                            if (municipiosLayer) {
                                municipiosLayer.eachLayer(layer => {
                                    const props = layer.feature.properties;
                                    const municipioName = props.name || props.nome || props.municipio || props.description;

                                    // Extrair estado do município
                                    let municipioState = props.uf || props.estado || props.sigla_uf ||
                                        props.UF || props.ESTADO || props.cd_geocuf;

                                    if (!municipioState && props.uf_municipio) {
                                        // Formato: "Rondônia - Alta Floresta D oeste" - extrair o nome do estado
                                        const match = props.uf_municipio.match(/^([^-]+)\s*-/);
                                        if (match) {
                                            const estadoNome = match[1].trim();
                                            // Converter nome do estado para sigla usando a função existente
                                            municipioState = getStateCodeByName(estadoNome);
                                        }
                                    }

                                    // Se o município não pertence ao estado selecionado, forçar azul
                                    if (municipioState && municipioState !== currentState.code) {
                                        layer.setStyle({
                                            fillColor: "#3b82f6",
                                            weight: 1,
                                            opacity: 1,
                                            color: 'white',
                                            fillOpacity: 0.6
                                        });
                                    }
                                });
                            }
                        }
                    }

                    let canShowCards = false;

                    function handleStateClick(e) {
                        canShowCards = false;
                        console.log('Estado clicado - não deve mostrar cards');
                        const properties = e.target.feature.properties;
                        let stateCode = getStateCode(properties);
                        let stateName = properties.nome || properties.name || properties.NAME;



                        // Reset completo ANTES de qualquer operação
                        // Reset do estado anterior se existir
                        if (selectedStateLayer) {
                            geoJsonLayer.resetStyle(selectedStateLayer);
                        }

                        // Remove municípios anteriores se existirem
                        if (municipiosLayer) {
                            map.removeLayer(municipiosLayer);
                            municipiosLayer = null;
                        }

                        // Remover layer de highlight de representantes se existir
                        if (highlightedMunicipiosLayer) {
                            map.removeLayer(highlightedMunicipiosLayer);
                            highlightedMunicipiosLayer = null;
                        }

                        // Reset do município selecionado
                        selectedMunicipioLayer = null;

                        // Limpar resultados e legenda
                        updateLegend([]);

                        // Garantir que não há resultados visíveis - MOSTRAR MENSAGEM SUGERINDO CLICAR EM MUNICÍPIO

                        resultsContainer.innerHTML = '<div class="text-center text-gray-500 py-8">Clique em um município ou bairro para ver os representantes.</div>';

                        // Seleciona o novo estado
                        selectedStateLayer = e.target;
                        selectedStateLayer.setStyle(selectedMapStyle);
                        currentState = { code: stateCode, name: stateName, layer: e.target };

                        // Aplicar zoom no estado
                        const stateBounds = e.target.getBounds();


                        map.fitBounds(stateBounds, {
                            padding: [25, 25],
                            maxZoom: 8  // Limitar zoom máximo para não ficar muito próximo
                        });

                        // Aguardar um pouco para garantir que o zoom seja aplicado antes de carregar municípios
                        setTimeout(() => {
                            // Mostra municípios após o zoom
                            showMunicipios(stateCode, stateName, e.target);
                        }, 300); // 300ms de delay para garantir
                    }

                    // Filtrar municípios apenas do estado selecionado
                    function showMunicipios(stateCode, stateName, stateLayer) {
                        // Filtrar municípios do estado usando múltiplos critérios
                        const estadoMunicipios = municipiosData.features.filter(feature => {
                            const props = feature.properties;

                            // Para geojs-100-mun-v2.json, extrair UF do campo uf_municipio (formato: "UF - Município")
                            let municipioState = props.uf || props.estado || props.sigla_uf ||
                                props.UF || props.ESTADO || props.cd_geocuf;

                            // Se não encontrou, tentar extrair do uf_municipio
                            if (!municipioState && props.uf_municipio) {
                                // Formato: "Rondônia - Alta Floresta D oeste" - extrair o nome do estado
                                const match = props.uf_municipio.match(/^([^-]+)\s*-/);
                                if (match) {
                                    const estadoNome = match[1].trim();
                                    // Converter nome do estado para sigla usando a função existente
                                    municipioState = getStateCodeByName(estadoNome);
                                }
                            }

                            // Comparar com código e nome do estado
                            const pertenceAoEstado = municipioState === stateCode ||
                                municipioState === stateName ||
                                normalize(municipioState) === normalize(stateCode) ||
                                normalize(municipioState) === normalize(stateName);

                            if (pertenceAoEstado) {
                                const municipioName = props.name || props.nome || props.municipio || props.description;
                            }

                            return pertenceAoEstado;
                        });

                        if (estadoMunicipios.length === 0) {
                            return;
                        }

                        // Remover layer de municípios anterior se existir
                        if (municipiosLayer) {
                            map.removeLayer(municipiosLayer);
                            municipiosLayer = null;
                        }

                        // Limpar labels antigos dos municípios
                        if (window.municipioLabels) {
                            window.municipioLabels.forEach(labelMarker => {
                                // Remover o marcador do label do mapa
                                if (labelMarker && map.hasLayer(labelMarker)) {

                                }

                            window.municipioLabels = [];

                        // CRÍTICO: Criar layer INICIALMENTE NÃO-INTERATIVA para evitar captura de clicks
                        municipiosLayer = L.geoJson(estadoMunicipios, {
                            style: feature => {
                                const municipioName = feature.properties.name || feature.properties.nome || feature.properties.municipio || feature.properties.description;
                                // Passar o código do estado para garantir que apenas este estado seja colorido
                                return getMunicipioStyleByRepresentative(municipioName, stateCode);
                            },
                            onEachFeature: function (feature, layer) {
                                // APENAS adicionar tooltip, SEM eventos de click por enquanto
                                const props = feature.properties;
                                const municipioName = props.name || props.nome || props.municipio || props.description;

                                let representatives = [];
                                if (viewMode === 'municipios' && currentState && currentState.code) {
                                    const cidadeEstadoKey = `${normalizedName}-${currentState.code.toLowerCase()}`;
                                    representatives = municipioRepresentativeMap.get(cidadeEstadoKey) || [];
                                }

                                // Tooltip simples com informações do município
                                let tooltipContent = `<strong>${municipioName}</strong>`;
                                if (representatives.length > 0) {
                                    tooltipContent += `<br><small>Representantes: ${representatives.length}</small>`;
                                    representatives.slice(0, 2).forEach(rep => {
                                        const color = representativeColorMap.get(rep.id) || '#3b82f6';
                                        tooltipContent += `<br><span style="color: ${color}; font-weight: bold;">•</span> ${rep.NomeRepresentante}`;
                                    });
                                    if (representatives.length > 2) {
                                        tooltipContent += `<br>... e mais ${representatives.length - 2}`;
                                    }
                                }

                                layer.bindTooltip(tooltipContent, {
                                    permanent: false,
                                    direction: 'top',
                                    className: 'municipio-tooltip'
                                });
                            },
                            interactive: false  // ⚠️ NÃO-INTERATIVO INICIALMENTE
                        }).addTo(map);

                        // Configurar a layer dos municípios para ter prioridade sobre os estados quando no modo municípios
                        municipiosLayer.setZIndex(15);

                        // CORREÇÃO: Aplicar cores corretas dos representantes
                        setTimeout(() => {
                            if (municipiosLayer) {
                                municipiosLayer.eachLayer(layer => {
                                    const props = layer.feature.properties;
                                    const municipioName = props.name || props.nome || props.municipio || props.description;

                                    // Extrair estado do município
                                    let municipioState = props.uf || props.estado || props.sigla_uf ||
                                        props.UF || props.ESTADO || props.cd_geocuf;

                                    if (!municipioState && props.uf_municipio) {
                                        // Formato: "Rondônia - Alta Floresta D oeste" - extrair o nome do estado
                                        const match = props.uf_municipio.match(/^([^-]+)\s*-/);
                                        if (match) {
                                            const estadoNome = match[1].trim();
                                            // Converter nome do estado para sigla usando a função existente
                                            municipioState = getStateCodeByName(estadoNome);
                                        }
                                    }

                                    // Aplicar estilo baseado nos representantes
                                    const style = getMunicipioStyleByRepresentative(municipioName, municipioState);
                                    layer.setStyle(style);
                                });
                            }
                        }, 100);

                        // ⚠️ ADICIONAR EVENTOS DE CLICK APÓS DELAY
                        setTimeout(() => {
                            if (municipiosLayer) {
                                municipiosLayer.eachLayer(layer => {
                                    const feature = layer.feature;

                                    // Adicionar evento de click usando onEachMunicipioFeature
                                    onEachMunicipioFeature(feature, layer);

                                    // Tornar layer interativa
                                    layer.options.interactive = true;
                                    layer._path && layer._path.classList.add('leaflet-interactive');
                                });

                                canShowCards = true;
                                console.log('✅ Municípios agora são clicáveis');
                            }
                        }, 500); // 500ms de delay para garantir que o click no estado já foi processado

                        // Não mostrar legenda quando apenas o estado é selecionado
                        // A legenda só aparecerá quando um município específico for clicado
                        updateLegend([]);

                        viewMode = 'municipios';
                        mainTitle.textContent = `Municípios de ${stateName || stateCode} - Clique em um município para ver os representantes`;
                        backButton.classList.remove('hidden');

                        // Se for São Paulo, mostrar os bairros
                        if (stateCode === 'SP' || stateName === 'SAO PAULO') {
                            if (bairrosLayer) {
                                // Resetar destaque de bairros anteriores
                                bairrosLayer.eachLayer(layer => {
                                    const bairroName = layer.feature.properties.NOME_DIST;
                                    if (bairroName) {
                                        const normalizedBairroName = normalize(bairroName);
                                        const bairroEstadoKey = `${normalizedBairroName}-SP`;
                                        const representatives = municipioRepresentativeMap.get(bairroEstadoKey) || [];

                                        if (representatives.length > 0) {
                                            const firstRep = representatives[0];
                                            const color = representativeColorMap.get(firstRep.id) || '#3b82f6';
                                            layer.setStyle({
                                                color: '#DC2626',
                                                weight: 3,
                                                opacity: 1,
                                                dashArray: '8,6',
                                                fillColor: color,
                                                fillOpacity: 0.7,
                                            });
                                        } else {
                                            layer.setStyle({
                                                color: '#DC2626',
                                                weight: 2,
                                                opacity: 0.6,
                                                dashArray: '6,4',
                                                fillColor: '#3b82f6',
                                                fillOpacity: 0.2,
                                            });
                                        }
                                    }
                                });

                                // Atualizar estilos dos bairros baseado no estado atual
                                updateBairrosStyles();
                                map.addLayer(bairrosLayer);
                            }
                        } else {
                            // Se não for SP, remover os bairros se estiverem visíveis
                            if (bairrosLayer && map.hasLayer(bairrosLayer)) {
                                map.removeLayer(bairrosLayer);
                            }
                        }
                    }


                    // Função para atualizar estilos da camada de bairros baseado no estado atual
                    function updateBairrosStyles() {
                        if (!bairrosLayer) return;

                        bairrosLayer.eachLayer(function (layer) {
                            const feature = layer.feature;
                            const bairroName = feature.properties.NOME_DIST;

                            if (bairroName) {
                                const normalizedBairroName = normalize(bairroName);

                                // IMPORTANTE: Buscar representantes considerando o estado atual (SP para bairros)
                                // Apenas aplicar cores se estivermos visualizando especificamente o estado de SP
                                let representatives = [];
                                if (viewMode === 'municipios' && currentState && currentState.code === 'SP') {
                                    // Para bairros de SP, usar SEMPRE a chave bairro+estado
                                    const bairroEstadoKey = `${normalizedBairroName}-SP`;
                                    representatives = municipioRepresentativeMap.get(bairroEstadoKey) || [];
                                }

                                if (representatives.length > 0) {
                                    // Se há representantes, usar a cor do primeiro representante
                                    const firstRep = representatives[0];
                                    const color = representativeColorMap.get(firstRep.id) || '#3b82f6';

                                    layer.setStyle({
                                        color: '#DC2626',        // Vermelho para o contorno
                                        weight: 3,
                                        opacity: 1,
                                        dashArray: '8,6',        // Pontilhado/dashed
                                        fillColor: color,
                                        fillOpacity: 0.7,
                                    });
                                } else {
                                    // Estilo padrão para bairros sem representantes
                                    layer.setStyle({
                                        color: '#DC2626',        // Vermelho para o contorno
                                        weight: 2,
                                        opacity: 0.6,
                                        dashArray: '12,8',       // Mais pontilhado
                                        fillColor: '#3b82f6',   // Azul padrão
                                        fillOpacity: 0.3,
                                    });
                                }
                            }
                        });
                    }

                            // Para geojs-100-mun-v2.json, extrair UF do campo uf_municipio
                            if (!municipioState && props.uf_municipio) {

                            // Debug: log dos primeiros municípios para entender a estrutura
                            if (municipiosData.features.indexOf(feature) < 5) {
                                console.log('Município:', props.name || props.nome, 'Estado encontrado:', municipioState, 'Matches:', matches);
                            }

                            return matches;
                        });

                        console.log('Municípios encontrados para o estado:', estadoMunicipios.length);
                        if (estadoMunicipios.length === 0) {
                            console.log('Erro: Nenhum município encontrado para o estado');

                        }

                        // Encontrar o município específico
                        console.log('Procurando município específico:', municipioName);
                        const targetMunicipio = estadoMunicipios.find(feature => {
                            const props = feature.properties;
                            const name = props.name || props.nome || props.municipio || props.description;

                        });

                        if (!targetMunicipio) {
                            console.log('Município específico não encontrado, mostrando todos os municípios do estado');

                            showMunicipios(stateCode, stateName, stateFeature);

                        console.log('Município específico encontrado, criando layer...');

                        // Criar layer com todos os municípios do estado
                        console.log('Criando layer de municípios...');

                            style: feature => {

                                // Passar o código do estado para garantir que apenas este estado seja colorido
                                return getMunicipioStyleByRepresentative(name, stateCode);

                        }).addTo(map);

                    function getStateCodeByName(stateName) {
                        const stateToAbbrev = {
                            'SAO PAULO': 'SP', 'RIO DE JANEIRO': 'RJ', 'MINAS GERAIS': 'MG', 'BAHIA': 'BA',
                            'PARANA': 'PR', 'RIO GRANDE DO SUL': 'RS', 'PERNAMBUCO': 'PE', 'CEARA': 'CE',
                            'PARA': 'PA', 'SANTA CATARINA': 'SC', 'GOIAS': 'GO', 'MARANHAO': 'MA',
                            'PARAIBA': 'PB', 'AMAZONAS': 'AM', 'ESPIRITO SANTO': 'ES', 'MATO GROSSO': 'MT',
                            'ALAGOAS': 'AL', 'PIAUI': 'PI', 'DISTRITO FEDERAL': 'DF', 'MATO GROSSO DO SUL': 'MS',
                            'SERGIPE': 'SE', 'RIO GRANDE DO NORTE': 'RN', 'RONDONIA': 'RO', 'ACRE': 'AC',
                            'AMAPA': 'AP', 'RORAIMA': 'RR', 'TOCANTINS': 'TO'
                        };

                        const normalizedStateName = normalize(stateName).toUpperCase();
                        const stateCode = stateToAbbrev[normalizedStateName];



                        return stateCode || null;
                    }

                    function getStateNameByCode(stateCode) {
                        const codeToState = {
                            'SP': 'São Paulo', 'RJ': 'Rio de Janeiro', 'MG': 'Minas Gerais', 'BA': 'Bahia',
                            'PR': 'Paraná', 'RS': 'Rio Grande do Sul', 'PE': 'Pernambuco', 'CE': 'Ceará',
                            'PA': 'Pará', 'SC': 'Santa Catarina', 'GO': 'Goiás', 'MA': 'Maranhão',
                            'PB': 'Paraíba', 'AM': 'Amazonas', 'ES': 'Espírito Santo', 'MT': 'Mato Grosso',
                            'AL': 'Alagoas', 'PI': 'Piauí', 'DF': 'Distrito Federal', 'MS': 'Mato Grosso do Sul',
                            'SE': 'Sergipe', 'RN': 'Rio Grande do Norte', 'RO': 'Rondônia', 'AC': 'Acre',
                            'AP': 'Amapá', 'RR': 'Roraima', 'TO': 'Tocantins'
                        };

                        return codeToState[stateCode] || null;
                    }

                    // Função para obter o estado de um município baseado nas propriedades do GeoJSON
                    function getMunicipioState(props) {
                        // Para geojs-100-mun-v2.json, extrair UF do campo uf_municipio (formato: "Estado - Município")
                        let municipioState = props.uf || props.estado || props.sigla_uf ||

                        // Se não encontrou, tentar extrair do uf_municipio
                        if (!municipioState && props.uf_municipio) {

                            const match = props.uf_municipio.match(/^([^-]+)\s*-\s*/);

                        // 🔄 REFRESH COMPLETO: Limpar estado anterior antes de filtrar município (apenas se não for skipado)
                        // CORREÇÃO: Não fazer refresh quando estamos apenas navegando entre municípios do mesmo estado
                        if (!skipRefresh && !currentState) {
                            await refreshForNewSuggestion();
                        }

                        // CORREÇÃO CRÍTICA: Usar busca rigorosa e direta no municipioRepresentativeMap
                        const normalizedName = normalize(municipioName);
                        let representatives = [];
                        let estadoMunicipio = null;

                        // 1. PRIORIDADE MÁXIMA: Se estamos visualizando um estado específico, usar APENAS ele

                                representatives = [];

                        } else {

                            if (municipiosData && municipiosData.features) {

                                municipioFeature = municipiosData.features.find(feature => {

                                if (municipioFeature) {
                                    const props = municipioFeature.properties;

                                    if (props.uf_municipio) {
                                        const ufMunicipio = props.uf_municipio.split(' - ')[0];
                                        const stateToAbbrev = {
                                            'São Paulo': 'SP', 'Rio de Janeiro': 'RJ', 'Minas Gerais': 'MG', 'Bahia': 'BA',
                                            'Paraná': 'PR', 'Rio Grande do Sul': 'RS', 'Pernambuco': 'PE', 'Ceará': 'CE',
                                            'Pará': 'PA', 'Santa Catarina': 'SC', 'Goiás': 'GO', 'Maranhão': 'MA',
                                            'Paraíba': 'PB', 'Amazonas': 'AM', 'Espírito Santo': 'ES', 'Mato Grosso': 'MT',
                                            'Alagoas': 'AL', 'Piauí': 'PI', 'Distrito Federal': 'DF', 'Mato Grosso do Sul': 'MS',
                                            'Sergipe': 'SE', 'Rio Grande do Norte': 'RN', 'Rondônia': 'RO', 'Acre': 'AC',
                                            'Amapá': 'AP', 'Roraima': 'RR', 'Tocantins': 'TO'
                                        };
                                        estadoMunicipio = stateToAbbrev[ufMunicipio] || estadoMunicipio;

                                        // Buscar representantes APENAS neste estado específico
                                        const cidadeEstadoKey = `${normalizedName}-${estadoMunicipio.toLowerCase()}`;
                                        const repsNoEstado = municipioRepresentativeMap.get(cidadeEstadoKey) || [];
                                        representatives = repsNoEstado;
                                    }
                                }
                            }

                            // 3. ÚLTIMO RECURSO: Se não conseguiu determinar o estado, buscar em todos os estados
                            // MAS com busca rigorosa para evitar conflitos
                            if (representatives.length === 0) {
                                const allCidadeResults = searchInCidades(normalizedName, null);
                                representatives = representativesData.filter(rep => allCidadeResults.has(rep.id));
                            }
                        }

                        // 4. FILTRAGEM FINAL: Remover representantes duplicados e aplicar regras rigorosas
                        const filteredRepresentatives = [];

                        representatives.forEach(rep => {

                                // VERIFICAÇÃO FINAL: Garantir que o representante realmente atende esta cidade
                                if (rep.EstadosDetalhados) {

                                    Object.entries(rep.EstadosDetalhados).forEach(([estado, dadosEstado]) => {

                                            // Busca EXATA na lista de cidades
                                            if (dadosEstado.cidades.some(c => normalize(c) === normalizedName)) {
                                                atendeCidade = true;
                                            }
                                        }
                                    });

                                    if (atendeCidade) {
                                        filteredRepresentatives.push(rep);
                                    }
                                } else {
                                    // Estrutura antiga: verificar CidadesAtendidas
                                    if (rep.CidadesAtendidas && Array.isArray(rep.CidadesAtendidas)) {
                                        if (rep.CidadesAtendidas.some(c => normalize(c) === normalizedName)) {
                                            filteredRepresentatives.push(rep);
                                        }
                                    }
                                }
                            }
                        });



                        renderResults(filteredRepresentatives, municipioName);
                        mainTitle.textContent = `Representantes em ${municipioName}`;

                        // Mostrar legenda com os representantes encontrados
                        updateLegend(filteredRepresentatives);

                        ensureNonSelectedStatesStayBlue();

                    // --- LÓGICA E RENDERIZAÇÃO ---

                    function normalize(str) {
                        return (str || "")
                            .toString()
                            .normalize("NFD")
                            .replace(/[̀-ͯ]/g, "")
                            .replace(/[^\w\s]/gi, "")
                            .replace(/\s+/g, " ")
                            .trim()
                            .toLowerCase();
                    }

                    // Função de normalização mais precisa para busca exata
                    function normalizeExact(str) {
                        return (str || "")
                            .toString()
                            .normalize("NFD")
                            .replace(/[̀-ͯ]/g, "")
                            .replace(/[^\w\s]/gi, "")
                            .replace(/\s+/g, " ")
                            .trim()
                            .toLowerCase();
                    }

                    // Função para verificar correspondência exata ou parcial controlada
                    function isExactMatch(query, target) {
                        // Usar a função global de busca rigorosa
                        return strictSearch(query, target, {
                            minLength: 4,
                            useStartsWith: true,
                            maxSimilarity: 0.9,
                            maxLengthDiff: 2
                        });
                    }

                    // Função para detectar termos combinados na busca
                    function detectarTermoCombinado(normalizedQuery) {
                        // 1. Padrão de cidade + estado (ex: "belém pará", "belém do pará")
                        const padraoCidadeEstado = /^(.+?)\s+(?:do\s+)?([a-z]{2}|pará|são paulo|rio de janeiro|minas gerais|bahia|paraná|rio grande do sul|pernambuco|ceará|santa catarina|goiás|maranhão|paraíba|amazonas|espírito santo|mato grosso|alagoas|piauí|distrito federal|mato grosso do sul|sergipe|rio grande do norte|rondônia|acre|amapá|roraima|tocantins)$/i;

                        if (padraoCidadeEstado.test(normalizedQuery)) {
                            const match = normalizedQuery.match(padraoCidadeEstado);
                            const cidade = match[1].trim();
                            const estado = match[2].trim();

                            // Converter nome do estado para sigla
                            const stateToAbbrev = {
                                'pará': 'PA', 'são paulo': 'SP', 'rio de janeiro': 'RJ', 'minas gerais': 'MG',
                                'bahia': 'BA', 'paraná': 'PR', 'rio grande do sul': 'RS', 'pernambuco': 'PE',
                                'ceará': 'CE', 'santa catarina': 'SC', 'goiás': 'GO', 'maranhão': 'MA',
                                'paraíba': 'PB', 'amazonas': 'AM', 'espírito santo': 'ES', 'mato grosso': 'MT',
                                'alagoas': 'AL', 'piauí': 'PI', 'distrito federal': 'DF', 'mato grosso do sul': 'MS',
                                'sergipe': 'SE', 'rio grande do norte': 'RN', 'rondônia': 'RO', 'acre': 'AC',
                                'amapá': 'AP', 'roraima': 'RR', 'tocantins': 'TO'
                            };

                            const siglaEstado = stateToAbbrev[estado] || estado.toUpperCase();

                            // Verificar se a cidade existe no estado
                            const cidadeExiste = verificarCidadeNoEstado(cidade, siglaEstado);

                            if (cidadeExiste) {
                                return {
                                    tipo: 'cidade_estado',
                                    cidade: cidade.charAt(0).toUpperCase() + cidade.slice(1),
                                    estado: siglaEstado,
                                    original: `${cidade} ${estado}`
                                };
                            }
                        }

                        return null;
                    }

                    async function handleSearch(skipRefresh = false) {
                        const query = searchInput.value.trim();

                        if (!query) {
                            // Não fazer reset completo quando a query estiver vazia
                            // Apenas limpar o estado do input e esconder sugestões
                            hideSuggestions();
                            // Reset input state
                            searchInput.classList.remove('has-results', 'no-results', 'search-loading');
                            return;
                        }

                        // 🔄 REFRESH COMPLETO: Limpar estado anterior antes de nova busca manual (apenas se não for skipado)
                        if (!skipRefresh) {
                            await refreshForNewSuggestion();
                        }

                        // Adicionar estado de loading
                        searchInput.classList.add('search-loading');
                        searchInput.classList.remove('has-results', 'no-results');

                        // Adicionar ao histórico apenas se não foi uma busca de sugestão
                        if (document.activeElement !== searchInput || !suggestionsContainer.classList.contains('hidden')) {
                            addToRecentSearches(query);
                        }

                        hideSuggestions();

                        // Simular delay para mostrar loading (pode ser removido em produção)
                        setTimeout(() => {
                            // Usar a nova lógica hierárquica de busca
                            const results = searchRepresentatives(query);
                            const searchContext = detectSearchContext(normalize(query));

                            // Remover loading e adicionar estado baseado nos resultados
                            searchInput.classList.remove('search-loading');

                            if (results.length === 0) {
                                searchInput.classList.add('no-results');
                                renderResults([], query);
                            } else {
                                searchInput.classList.add('has-results');

                                // Gerar título baseado no contexto da busca
                                let title = generateSearchTitle(searchContext, query);
                                mainTitle.textContent = title;

                                renderResults(results, query);
                                updateLegend(results);
                            }

                            ensureNonSelectedStatesStayBlue();
                            document.getElementById('results-container').scrollIntoView({ behavior: 'smooth' });
                        }, 200); // Delay de 200ms para mostrar loading
                    }

                    // Função para gerar título baseado no contexto da busca
                    function generateSearchTitle(searchContext, originalQuery) {
                        switch (searchContext.type) {
                            case 'estado':
                                return `Representantes em ${searchContext.estado}`;
                            case 'cidade':
                                if (searchContext.estado) {
                                    return `Representantes em ${searchContext.cidade} - ${searchContext.estado}`;
                                }
                                return `Representantes em ${searchContext.cidade}`;
                            case 'bairro':
                                return `Representantes no bairro ${searchContext.bairro} - ${searchContext.estado}`;
                            case 'representante':
                                if (searchContext.estado && searchContext.cidade) {
                                    return `${searchContext.representante} em ${searchContext.cidade} - ${searchContext.estado}`;
                                } else if (searchContext.estado) {
                                    return `${searchContext.representante} em ${searchContext.estado}`;
                                } else if (searchContext.cidade) {
                                    return `${searchContext.representante} em ${searchContext.cidade}`;
                                }
                                return `Representante: ${searchContext.representante}`;
                            case 'cidade_estado':
                                return `Representantes em ${searchContext.cidade} - ${searchContext.estado}`;
                            case 'bairro_estado':
                                return `Representantes no bairro ${searchContext.bairro} - ${searchContext.estado}`;
                            default:
                                return `Resultados para: ${originalQuery}`;
                        }
                    }

                                    } else if (telefones.length <= 3) {

                        ${telefonesHtml ? `<div class="text-gray-700 text-sm mb-1"><div class="flex items-start gap-2"><i data-lucide="phone" class="w-4 h-4 mt-0.5 flex-shrink-0"></i> <div class="flex-1">${telefonesHtml}</div></div></div>` : ''}
                    </div>
                `;

                    // Renderizar representantes de um estado de forma estrita
                    async function renderRepresentativesForState(stateCode, stateLabel, skipRefresh = false) {
                        // 🔄 REFRESH COMPLETO: Limpar estado anterior antes de renderizar estado (apenas se não for skipado)
                        if (!skipRefresh) {
                            await refreshForNewSuggestion();
                        }

                        const code = stateCode.toUpperCase();
                        const filtered = representativesData.filter(rep => {
                            if (rep.EstadosDetalhados) {
                                if (rep.EstadosDetalhados[code]) return true;
                                // Aceitar casos onde a chave é o nome do estado
                                return Object.keys(rep.EstadosDetalhados).some(k => normalize(k) === normalize(stateLabel));
                            }
                            if (rep.SiglaEstado) {
                                return normalize(rep.SiglaEstado) === normalize(code) || normalize(rep.Estado) === normalize(stateLabel);
                            }
                            return false;
                        });

                        mainTitle.textContent = `Representantes em ${stateLabel}`;
                        backButton.classList.remove('hidden');
                        updateLegend(filtered);
                        renderResults(filtered, stateLabel);
                    }

                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                            </svg>
                        `;
                            maximizeBtn.title = 'Maximizar mapa';
                        } else {
                            // Maximizar mapa em tela cheia
                            container.classList.add('map-maximized');
                            document.body.classList.add('map-fullscreen');
                            maximizeBtn.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        `;
                            maximizeBtn.title = 'Restaurar mapa';
                        }

                        // Forçar redimensionamento do mapa
                        setTimeout(() => {
                            if (map) {
                                map.invalidateSize();
                            }
                        }, 100);
                    }

                    // Função para adicionar label com nome do município
                    function addMunicipioLabel(layer, municipioName) {
                        // Função desabilitada - labels removidos conforme solicitado
                        return;

                        // Obter o centro do município
                        const bounds = layer.getBounds();
                        const center = bounds.getCenter();

                        // Criar um div personalizado para o label fixo
                        const labelDiv = document.createElement('div');
                        labelDiv.className = 'municipio-label-fixo';
                        labelDiv.innerHTML = municipioName;
                        labelDiv.style.cssText = `
                        position: absolute;
                        background: transparent;
                        border: none;
                        border-radius: 0;
                        padding: 0;
                        font-size: 5px;
                        font-weight: 600;
                        color: #333;
                        text-align: center;
                        white-space: nowrap;
                        pointer-events: none;
                        z-index: 1000;
                        box-shadow: none;
                        transform: translate(-50%, -50%);
                    `;

                        // Criar um elemento Leaflet para o label
                        const labelElement = L.divIcon({
                            html: labelDiv,
                            className: 'municipio-label-container',
                            iconSize: [1, 1],
                            iconAnchor: [0, 0]
                        });

                        // Criar um marcador para o label
                        const labelMarker = L.marker(center, {
                            icon: labelElement,
                            interactive: false
                        }).addTo(map);

                        // Armazenar referência para poder remover depois se necessário
                        if (!window.municipioLabels) {
                            window.municipioLabels = [];
                        }
                        window.municipioLabels.push(labelMarker);
                    }





                    // Função para destacar áreas atendidas por um representante
                    function highlightRepresentanteAreas(index) {
                        if (!window.currentResults || !window.currentResults[index]) {
                            return;
                        }

                        const representante = window.currentResults[index];

                        // VERIFICAÇÃO INICIAL: Se estamos no modo municípios, verificar se o representante atende o estado selecionado
                        if (viewMode === 'municipios' && currentState && currentState.code) {
                            let representanteAtendeEstado = false;

                            if (representante.EstadosDetalhados) {
                                // Verificar se o representante tem o estado selecionado
                                representanteAtendeEstado = Object.keys(representante.EstadosDetalhados).some(estado =>
                                    normalize(estado) === normalize(currentState.code) ||
                                    normalize(estado) === normalize(currentState.name)
                                );
                            } else if (representante.SiglaEstado) {
                                // Estrutura antiga
                                representanteAtendeEstado = normalize(representante.SiglaEstado) === normalize(currentState.code) ||
                                    normalize(representante.Estado) === normalize(currentState.name);
                            }

                            if (!representanteAtendeEstado) {
                                return; // Não processar este representante
                            }
                        }

                        // Remover highlight anterior se existir
                        if (highlightedMunicipiosLayer) {
                            map.removeLayer(highlightedMunicipiosLayer);
                            highlightedMunicipiosLayer = null;
                        }

                        // Encontrar municípios atendidos pelo representante
                        const municipiosDestacados = [];

                        if (representante.EstadosDetalhados) {
                            // Nova estrutura: percorrer estados e suas cidades
                            Object.entries(representante.EstadosDetalhados).forEach(([estado, dadosEstado]) => {
                                // CRÍTICO: Se estivermos visualizando um estado específico, mostrar APENAS municípios deste estado
                                if (viewMode === 'municipios' && currentState && currentState.code) {
                                    // Verificar se o estado do representante corresponde ao estado atualmente selecionado
                                    const estadoCorresponde = normalize(estado) === normalize(currentState.code) ||
                                        normalize(estado) === normalize(currentState.name);

                                    if (!estadoCorresponde) {
                                        return; // Pular este estado se não for o estado atual
                                    }

                                    // FORÇAR: Apenas processar municípios deste estado específico
                                }

                                if (dadosEstado.cidades && Array.isArray(dadosEstado.cidades)) {
                                    dadosEstado.cidades.forEach(cidade => {
                                        const normalizedCidade = normalize(cidade);

                                        // CRÍTICO: Buscar município APENAS no estado selecionado
                                        // Evitar conflitos de cidades com mesmo nome em estados diferentes
                                        const municipioFeature = municipiosData.features.find(feature => {
                                            const props = feature.properties;
                                            const municipioName = props.name || props.nome || props.municipio || props.description;
                                            const municipioState = props.uf || props.estado || props.sigla_uf || props.UF || props.ESTADO || props.cd_geocuf;

                                            // Para geojs-100-mun-v2.json, extrair UF do campo uf_municipio
                                            let extractedState = municipioState;
                                            if (!extractedState && props.uf_municipio) {
                                                // Formato: "Rondônia - Alta Floresta D oeste" - extrair o nome do estado
                                                const match = props.uf_municipio.match(/^([^-]+)\s*-/);
                                                if (match) {
                                                    const estadoNome = match[1].trim();
                                                    // Converter nome do estado para sigla usando a função existente
                                                    extractedState = getStateCodeByName(estadoNome);
                                                }
                                            }

                                            // VERIFICAÇÃO 1: Nome do município deve corresponder
                                            const nomeCorresponde = normalize(municipioName) === normalizedCidade;
                                            if (!nomeCorresponde) return false;

                                            // VERIFICAÇÃO 2: Estado do município deve corresponder ao estado do representante
                                            const estadoRepresentanteCorresponde = extractedState === estado || normalize(extractedState) === normalize(estado);
                                            if (!estadoRepresentanteCorresponde) return false;

                                            // VERIFICAÇÃO 3: CRÍTICA - Se estamos no modo municípios, o município deve estar no estado selecionado
                                            if (viewMode === 'municipios' && currentState && currentState.code) {
                                                // FORÇAR: Comparação exata de estado primeiro
                                                let pertenceAoEstadoSelecionado = false;

                                                // Comparação direta (mais rigorosa)
                                                if (extractedState === currentState.code) {
                                                    pertenceAoEstadoSelecionado = true;
                                                }
                                                // Comparação normalizada (fallback)
                                                else if (normalize(extractedState) === normalize(currentState.code)) {
                                                    pertenceAoEstadoSelecionado = true;
                                                }
                                                // Comparação por nome (último recurso)
                                                else if (normalize(extractedState) === normalize(currentState.name)) {
                                                    pertenceAoEstadoSelecionado = true;
                                                }

                                                if (!pertenceAoEstadoSelecionado) {
                                                    return false;
                                                }
                                            }

                                            return true;
                                        });

                                        if (municipioFeature) {
                                            municipiosDestacados.push(municipioFeature);
                                        }
                                    });
                                }
                            });
                        } else {
                            // Estrutura antiga: usar CidadesAtendidas
                            // CRÍTICO: Se estivermos visualizando um estado específico, mostrar APENAS municípios deste estado
                            if (viewMode === 'municipios' && currentState && currentState.code) {
                                const estadoCorresponde = normalize(representante.SiglaEstado) === normalize(currentState.code) ||
                                    normalize(representante.Estado) === normalize(currentState.name);

                                if (!estadoCorresponde) {
                                    // Não destacar municípios de outros estados quando estiver focado em um estado específico
                                    return;
                                }
                            }

                            const cidadesAtendidas = representante.CidadesAtendidas || [];
                            cidadesAtendidas.forEach(cidade => {
                                const normalizedCidade = normalize(cidade);

                                // CRÍTICO: Buscar município APENAS no estado selecionado
                                // Evitar conflitos de cidades com mesmo nome em estados diferentes
                                const municipioFeature = municipiosData.features.find(feature => {
                                    const props = feature.properties;
                                    const municipioName = props.name || props.nome || props.municipio || props.description;
                                    const municipioState = props.uf || props.estado || props.sigla_uf || props.UF || props.ESTADO || props.cd_geocuf;

                                    // Para geojs-100-mun-v2.json, extrair UF do campo uf_municipio
                                    let extractedState = municipioState;
                                    if (!extractedState && props.uf_municipio) {
                                        // Formato: "Rondônia - Alta Floresta D oeste" - extrair o nome do estado
                                        const match = props.uf_municipio.match(/^([^-]+)\s*-/);
                                        if (match) {
                                            const estadoNome = match[1].trim();
                                            // Converter nome do estado para sigla usando a função existente
                                            extractedState = getStateCodeByName(estadoNome);
                                        }
                                    }

                                    // VERIFICAÇÃO 1: Nome do município deve corresponder
                                    const nomeCorresponde = normalize(municipioName) === normalizedCidade;
                                    if (!nomeCorresponde) return false;

                                    // VERIFICAÇÃO 2: Estado do município deve corresponder ao estado do representante
                                    const estadoRepresentanteCorresponde = extractedState === representante.SiglaEstado || normalize(extractedState) === normalize(representante.SiglaEstado);
                                    if (!estadoRepresentanteCorresponde) return false;

                                    // VERIFICAÇÃO 3: CRÍTICA - Se estamos no modo municípios, o município deve estar no estado selecionado
                                    if (viewMode === 'municipios' && currentState && currentState.code) {
                                        // FORÇAR: Comparação exata de estado primeiro
                                        let pertenceAoEstadoSelecionado = false;

                                        // Comparação direta (mais rigorosa)
                                        if (extractedState === currentState.code) {
                                            pertenceAoEstadoSelecionado = true;
                                        }
                                        // Comparação normalizada (fallback)
                                        else if (normalize(extractedState) === normalize(currentState.code)) {
                                            pertenceAoEstadoSelecionado = true;
                                        }
                                        // Comparação por nome (último recurso)
                                        else if (normalize(extractedState) === normalize(currentState.name)) {
                                            pertenceAoEstadoSelecionado = true;
                                        }

                                        if (!pertenceAoEstadoSelecionado) {
                                            return false;
                                        }
                                    }

                                    return true;
                                });

                                if (municipioFeature) {
                                    municipiosDestacados.push(municipioFeature);
                                }
                            });
                        }

                        if (municipiosDestacados.length === 0) {
                            return; // Não mostrar alert, apenas não destacar nada
                        }

                        // Criar camada de destaque
                        const representanteColor = representativeColorMap.get(representante.id) || '#FF6B6B';

                        highlightedMunicipiosLayer = L.geoJson(municipiosDestacados, {
                            style: {
                                fillColor: representanteColor,
                                weight: 3,
                                opacity: 1,
                                color: '#FFFFFF',
                                dashArray: '5,5',
                                fillOpacity: 0.8
                            },
                            onEachFeature: function (feature, layer) {
                                const props = feature.properties;
                                const municipioName = props.name || props.nome || props.municipio || props.description;

                                layer.bindTooltip(`
                                <strong>${municipioName}</strong><br>
                                <span style="color: ${representanteColor}; font-weight: bold;">●</span> ${representante.NomeRepresentante}
                            `, {
                                    permanent: false,
                                    direction: 'top',
                                    className: 'highlight-tooltip'
                                });
                            }
                        }).addTo(map);

                        // Fazer zoom para mostrar todos os municípios destacados
                        if (highlightedMunicipiosLayer.getBounds().isValid()) {
                            map.fitBounds(highlightedMunicipiosLayer.getBounds(), {
                                padding: [20, 20],
                                maxZoom: 8
                            });
                        }

                        // Destacar o card clicado
                        document.querySelectorAll('.result-item').forEach((card, i) => {
                            if (i === index) {
                                card.style.backgroundColor = representanteColor + '20'; // 20% opacity
                                card.style.borderLeft = `4px solid ${representanteColor}`;
                            } else {
                                card.style.backgroundColor = '';
                                card.style.borderLeft = '';
                            }
                        });

                        // Aplicar função para manter ordem das layers
                        ensureNonSelectedStatesStayBlue();



                        // Atualizar título
                        mainTitle.textContent = `Áreas atendidas por ${representante.NomeRepresentante} (${municipiosDestacados.length} municípios)`;
                    }

                    function resetView(clearSearch = true) {
                        // Reset de todas as seleções
                        if (selectedStateLayer) {
                            geoJsonLayer.resetStyle(selectedStateLayer);
                            selectedStateLayer = null;
                        }

                        if (selectedMunicipioLayer) {
                            selectedMunicipioLayer = null;
                        }

                        if (municipiosLayer) {
                            map.removeLayer(municipiosLayer);
                            municipiosLayer = null;
                        }

                        if (highlightedMunicipiosLayer) {
                            map.removeLayer(highlightedMunicipiosLayer);
                            highlightedMunicipiosLayer = null;
                        }

                        // Remover bairros quando voltar para visualização geral
                        if (bairrosLayer && map.hasLayer(bairrosLayer)) {
                            map.removeLayer(bairrosLayer);

                        }

                        // Reset dos estilos dos bairros se estiverem visíveis
                        if (bairrosLayer) {
                            bairrosLayer.eachLayer(layer => {
                                // Resetar para o estilo padrão dos bairros
                                const bairroName = layer.feature.properties.NOME_DIST;
                                if (bairroName) {
                                    const normalizedBairroName = normalize(bairroName);
                                    const bairroEstadoKey = `${normalizedBairroName}-SP`;
                                    const representatives = municipioRepresentativeMap.get(bairroEstadoKey) || [];

                                    if (representatives.length > 0) {
                                        const firstRep = representatives[0];
                                        const color = representativeColorMap.get(firstRep.id) || '#3b82f6';
                                        layer.setStyle({
                                            color: '#DC2626',
                                            weight: 3,
                                            opacity: 1,
                                            dashArray: '8,6',
                                            fillColor: color,
                                            fillOpacity: 0.7,
                                        });
                                    } else {
                                        layer.setStyle({
                                            color: '#DC2626',
                                            weight: 2,
                                            opacity: 0.6,
                                            dashArray: '6,4',
                                            fillColor: '#3b82f6',
                                            fillOpacity: 0.2,
                                        });
                                    }
                                }
                            });
                        }

                        currentState = null;
                        viewMode = 'states';

                        // Garantir que todos os estados voltem para cor azul padrão
                        geoJsonLayer.eachLayer(layer => {
                            layer.setStyle(defaultMapStyle);
                        });

                        // Manter apenas estados não selecionados em azul
                        ensureNonSelectedStatesStayBlue();

                        map.setView([-15.78, -47.92], 4);
                        if (clearSearch) {
                            searchInput.value = '';
                            showInitialMessage();
                            backButton.classList.add('hidden');
                            mainTitle.textContent = 'Escolha sua região para encontrar representantes';
                        }

                        // Atualizar estilos dos municípios se ainda estiverem visíveis
                        if (municipiosLayer) {
                            municipiosLayer.eachLayer(layer => {
                                const props = layer.feature.properties;
                                const municipioName = props.name || props.nome || props.municipio || props.description;
                                // Como estamos resetando a view, forçar cor azul padrão (sem estado específico)
                                layer.setStyle(getMunicipioStyleByRepresentative(municipioName, null));
                            });
                        }

                        // Esconder legenda
                        updateLegend([]);

                        // Remove legenda de cores se existir
                        const existingLegend = document.getElementById('color-legend');
                        if (existingLegend) {
                            existingLegend.remove();
                        }

                        // Reset dos cards destacados
                        document.querySelectorAll('.result-item').forEach(card => {
                            card.style.backgroundColor = '';
                            card.style.borderLeft = '';
                        });
                    }

                    initializeApp();
                });
            </script>

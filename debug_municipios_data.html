<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dados dos Municípios</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .debug-item { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        .error { background: #ffebee; border-left: 4px solid #f44336; }
        .success { background: #e8f5e8; border-left: 4px solid #4caf50; }
        .warning { background: #fff3e0; border-left: 4px solid #ff9800; }
        .info { background: #e3f2fd; border-left: 4px solid #2196f3; }
        pre { background: #f8f8f8; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug: Dados dos Municípios</h1>
    
    <div class="debug-section">
        <h2>1. Carregando dados dos municípios</h2>
        <div id="loading-status" class="debug-item">Carregando...</div>
    </div>
    
    <div class="debug-section">
        <h2>2. Estrutura dos dados</h2>
        <div id="structure-status" class="debug-item">Aguardando dados...</div>
    </div>
    
    <div class="debug-section">
        <h2>3. Testando coordenadas do Rio de Janeiro</h2>
        <div id="test-status" class="debug-item">Aguardando dados...</div>
    </div>
    
    <div class="debug-section">
        <h2>4. Logs detalhados</h2>
        <div id="logs" class="debug-item" style="max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px;"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `debug-item ${type}`;
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
    
        }

        // Função para verificar se um ponto está dentro de um polígono (ray casting)
        function pointInPolygon(point, polygon) {
            const x = point.lat, y = point.lng;
            let inside = false;

            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i].lat, yi = polygon[i].lng;
                const xj = polygon[j].lat, yj = polygon[j].lng;

                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        async function debugMunicipiosData() {
            try {
                log('🚀 Iniciando debug dos dados dos municípios...', 'success');
                
                // 1. Carregar dados dos municípios
                log('📥 Carregando dados dos municípios...');
                const municipiosJsonUrl = 'https://raw.githubusercontent.com/screamonei2/mapa-brasil-representantes/main/old/geojs-100-mun-v2.json';
                
                const response = await fetch(municipiosJsonUrl);
                if (!response.ok) {
                    throw new Error(`Erro ao carregar dados: ${response.statusText}`);
                }
                
                const municipiosData = await response.json();
                
                document.getElementById('loading-status').innerHTML = `
                    <div class="success">
                        ✅ Dados carregados com sucesso<br>
                        📊 Tipo de dados: ${typeof municipiosData}<br>
                        📊 Estrutura: ${Array.isArray(municipiosData) ? 'Array' : 'Object'}
                    </div>
                `;
                
                // 2. Verificar estrutura dos dados
                log('🔍 Analisando estrutura dos dados...');
                
                if (municipiosData.features && Array.isArray(municipiosData.features)) {
                    log(`✅ Estrutura GeoJSON válida encontrada`, 'success');
                    log(`📊 Total de features: ${municipiosData.features.length}`);
                    
                    // Verificar primeiro município
                    const primeiroMunicipio = municipiosData.features[0];
                    log(`📋 Primeiro município:`, 'info');
                    log(`   • Tipo de geometria: ${primeiroMunicipio.geometry.type}`);
                    log(`   • Propriedades: ${Object.keys(primeiroMunicipio.properties).join(', ')}`);
                    log(`   • Coordenadas: ${primeiroMunicipio.geometry.coordinates.length} arrays`);
                    
                    // Verificar se há município do Rio de Janeiro
                    const municipioRio = municipiosData.features.find(feature => {
                        const props = feature.properties;
                        const nome = props.name || props.nome || props.municipio || props.description;
                        return nome && nome.toLowerCase().includes('rio de janeiro');
                    });
                    
                    if (municipioRio) {
                        log(`✅ Município do Rio de Janeiro encontrado!`, 'success');
                        log(`   • Nome: ${municipioRio.properties.name || municipioRio.properties.nome || municipioRio.properties.municipio || municipioRio.properties.description}`);
                        log(`   • Propriedades:`, 'info');
                        Object.entries(municipioRio.properties).forEach(([key, value]) => {
                            log(`     - ${key}: ${value}`);
                        });
                        
                        // Verificar geometria
                        log(`   • Geometria: ${municipioRio.geometry.type}`);
                        if (municipioRio.geometry.type === 'Polygon') {
                            log(`   • Coordenadas: ${municipioRio.geometry.coordinates[0].length} pontos`);
                            log(`   • Primeiras coordenadas: ${municipioRio.geometry.coordinates[0].slice(0, 3).map(coord => `[${coord[1]}, ${coord[0]}]`).join(', ')}`);
                        }
                    } else {
                        log(`❌ Município do Rio de Janeiro NÃO encontrado!`, 'error');
                    }
                    
                    document.getElementById('structure-status').innerHTML = `
                        <div class="success">
                            ✅ Estrutura válida<br>
                            📊 Total de municípios: ${municipiosData.features.length}<br>
                            📋 Primeiro município: ${primeiroMunicipio.properties.name || primeiroMunicipio.properties.nome || primeiroMunicipio.properties.municipio || primeiroMunicipio.properties.description}
                        </div>
                    `;
                    
                } else {
                    log(`❌ Estrutura inválida ou não é GeoJSON`, 'error');
                    log(`📊 Dados recebidos:`, 'error');
                    log(JSON.stringify(municipiosData, null, 2), 'error');
                    
                    document.getElementById('structure-status').innerHTML = `
                        <div class="error">
                            ❌ Estrutura inválida<br>
                            📊 Tipo: ${typeof municipiosData}<br>
                            📊 Chaves: ${Object.keys(municipiosData).join(', ')}
                        </div>
                    `;
                    return;
                }
                
                // 3. Testar coordenadas do Rio de Janeiro
                log('🧪 Testando coordenadas do Rio de Janeiro...');
                const coordenadasRio = { lat: -22.98873816096074, lng: -43.57452392578126 };
                log(`📍 Coordenadas de teste: lat=${coordenadasRio.lat}, lng=${coordenadasRio.lng}`);
                
                // Função para calcular a distância entre dois pontos
                function calculateDistance(point1, point2) {
                    const dx = point1.lat - point2.lat;
                    const dy = point1.lng - point2.lng;
                    return Math.sqrt(dx * dx + dy * dy);
                }

                // Função para encontrar o município mais próximo de um ponto
                function findNearestMunicipio(point, municipiosData) {
                    let nearestMunicipio = null;
                    let minDistance = Infinity;

                    for (const feature of municipiosData.features) {
                        if (feature.geometry.type === 'Polygon') {
                            // Calcular distância para o centro do polígono
                            const coords = feature.geometry.coordinates[0];
                            const center = {
                                lat: coords.reduce((sum, coord) => sum + coord[1], 0) / coords.length,
                                lng: coords.reduce((sum, coord) => sum + coord[0], 0) / coords.length
                            };
                            
                            const distance = calculateDistance(point, center);
                            if (distance < minDistance) {
                                minDistance = distance;
                                nearestMunicipio = feature;
                            }
                        } else if (feature.geometry.type === 'MultiPolygon') {
                            for (let polygon of feature.geometry.coordinates) {
                                const coords = polygon[0];
                                const center = {
                                    lat: coords.reduce((sum, coord) => sum + coord[1], 0) / coords.length,
                                    lng: coords.reduce((sum, coord) => sum + coord[0], 0) / coords.length
                                };
                                
                                const distance = calculateDistance(point, center);
                                if (distance < minDistance) {
                                    minDistance = distance;
                                    nearestMunicipio = feature;
                                }
                            }
                        }
                    }

                    return { municipio: nearestMunicipio, distance: minDistance };
                }
                
                let municipioEncontrado = null;
                let municipiosTestados = 0;
                
                // Primeiro tentar busca exata
                for (const feature of municipiosData.features) {
                    municipiosTestados++;
                    
                    if (municipiosTestados % 1000 === 0) {
                        log(`🔍 Testados ${municipiosTestados} municípios...`);
                    }
                    
                    if (feature.geometry.type === 'Polygon') {
                        const coords = feature.geometry.coordinates[0].map(coord => ({ lat: coord[1], lng: coord[0] }));
                        if (pointInPolygon(coordenadasRio, coords)) {
                            municipioEncontrado = feature;
                            log(`✅ Município encontrado para as coordenadas!`);
                            log(`   • Nome: ${feature.properties.name || feature.properties.nome || feature.properties.municipio || feature.properties.description}`);
                            break;
                        }
                    } else if (feature.geometry.type === 'MultiPolygon') {
                        for (let polygon of feature.geometry.coordinates) {
                            const coords = polygon[0].map(coord => ({ lat: coord[1], lng: coord[0] }));
                            if (pointInPolygon(coordenadasRio, coords)) {
                                municipioEncontrado = feature;
                                log(`✅ Município encontrado para as coordenadas (MultiPolygon)!`);
                                log(`   • Nome: ${feature.properties.name || feature.properties.nome || feature.properties.municipio || feature.properties.description}`);
                                break;
                            }
                        }
                        if (municipioEncontrado) break;
                    }
                }
                
                log(`🔍 Busca exata concluída. Total testado: ${municipiosTestados}`);
                
                // Se não encontrou, tentar fallback de município mais próximo
                if (!municipioEncontrado) {
                    log(`🔍 Tentando fallback de município mais próximo...`);
                    const nearestResult = findNearestMunicipio(coordenadasRio, municipiosData);
                    
                    if (nearestResult.municipio) {
                        log(`🔍 Município mais próximo encontrado: ${nearestResult.municipio.properties.name || nearestResult.municipio.properties.nome || nearestResult.municipio.properties.municipio || nearestResult.municipio.properties.description}`);
                        log(`📍 Distância: ${(nearestResult.distance * 111).toFixed(2)} km`);
                        
                        if (nearestResult.distance < 0.1) { // Threshold de 0.1 graus (~11km)
                            municipioEncontrado = nearestResult.municipio;
                            log(`✅ Usando município mais próximo como fallback!`, 'success');
                        } else {
                            log(`⚠️ Município mais próximo está muito longe (${(nearestResult.distance * 111).toFixed(2)} km)`, 'warning');
                        }
                    }
                }
                
                if (municipioEncontrado) {
                    log(`✅ SUCESSO: Município encontrado para as coordenadas do Rio de Janeiro!`, 'success');
                    document.getElementById('test-status').innerHTML = `
                        <div class="success">
                            ✅ Teste bem-sucedido!<br>
                            📍 Município encontrado: ${municipioEncontrado.properties.name || municipioEncontrado.properties.nome || municipioEncontrado.properties.municipio || municipioEncontrado.properties.description}<br>
                            📊 Total testado: ${municipiosTestados}
                        </div>
                    `;
                } else {
                    log(`❌ FALHA: Nenhum município encontrado para as coordenadas do Rio de Janeiro`, 'error');
                    document.getElementById('test-status').innerHTML = `
                        <div class="error">
                            ❌ Teste falhou!<br>
                            📍 Nenhum município encontrado para as coordenadas<br>
                            📊 Total testado: ${municipiosTestados}<br>
                            🔍 Possível problema na função pointInPolygon ou nos dados
                        </div>
                    `;
                }
                
            } catch (error) {
                log(`❌ Erro durante debug: ${error.message}`, 'error');
                document.getElementById('loading-status').innerHTML = `
                    <div class="error">
                        ❌ Erro ao carregar dados: ${error.message}
                    </div>
                `;
            }
        }
        
        // Executar debug quando a página carregar
        document.addEventListener('DOMContentLoaded', debugMunicipiosData);
    </script>
</body>
</html>
